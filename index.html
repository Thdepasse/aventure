<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aventure Asie</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root {
    --ink: #1a1410;
    --paper: #f7f3ed;
    --paper2: #ede8e0;
    --paper3: #e3ddd4;
    --gold: #c9922a;
    --gold-light: #f0d9a8;
    --ocean: #1a5c8a;
    --jungle: #2d6a3f;
    --sand: #c4a267;
    --danger: #c0392b;
    --warn: #e67e22;
    --ok: #27ae60;
    --MY: #854F0B; --MY-bg: #fdf3e3;
    --PH: #1a5c8a; --PH-bg: #e8f4fd;
    --ID: #2d6a3f; --ID-bg: #e8f7ed;
    --SG: #555; --SG-bg: #f0eeea;
    --radius: 12px;
    --shadow: 0 2px 12px rgba(26,20,16,.10);
    --shadow-lg: 0 8px 32px rgba(26,20,16,.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }

  /* &#9472;&#9472; MAIN &#9472;&#9472; */
  #main {
    margin-left: 0;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }

  /* &#9472;&#9472; TOPBAR &#9472;&#9472; */
  #topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(247,243,237,.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--paper3);
    padding: 14px 32px;
    display: flex; align-items: center; gap: 16px;
  }
  #topbar-title { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-size: 22px; flex: 1; }
  #topbar-title span { color: var(--gold); font-style: italic; }
  #topbar-views { display: flex; gap: 4px; }
  .view-btn {
    padding: 6px 14px; border-radius: 8px;
    border: 1px solid var(--paper3); background: transparent;
    font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 12px;
    cursor: pointer; color: #888; transition: all .15s;
  }
  .view-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* &#9472;&#9472; SEASON PICKER (topbar) &#9472;&#9472; */
  #season-picker { position: relative; }
  .season-pill {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 20px;
    border: 1.5px solid currentColor; background: transparent;
    font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .season-pill svg { opacity: .6; }
  #season-menu {
    display: none; position: absolute; top: calc(100% + 8px); left: 0;
    background: #fff; border: 1px solid var(--paper3); border-radius: 12px;
    box-shadow: var(--shadow-lg); padding: 10px; min-width: 210px; z-index: 60;
  }
  #season-menu.open { display: block; }
  .season-menu-label { font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: .08em; margin: 2px 4px 8px; }
  .season-menu-item {
    display: flex; align-items: center; width: 100%; text-align: left;
    padding: 8px 10px; border-radius: 8px; border: 1px solid transparent;
    background: transparent; color: #666;
    font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px;
    cursor: pointer; margin-bottom: 3px; transition: all .15s;
  }
  .season-menu-item:hover { background: var(--paper2); color: var(--ink); }
  .season-menu-item.active {
    border-color: var(--active-color, var(--gold));
    background: var(--paper2); color: var(--ink); font-weight: 500;
  }
  .season-menu-item .season-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }

  /* &#9472;&#9472; ACTIONS MENU (topbar) &#9472;&#9472; */
  #topbar-actions { position: relative; }
  .topbar-menu-btn {
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 8px;
    border: 1px solid var(--paper3); background: transparent;
    color: #888; cursor: pointer; transition: all .15s;
  }
  .topbar-menu-btn:hover { color: var(--ink); border-color: #ccc; }
  #actions-menu {
    display: none; position: absolute; top: calc(100% + 8px); right: 0;
    background: #fff; border: 1px solid var(--paper3); border-radius: 12px;
    box-shadow: var(--shadow-lg); padding: 8px; min-width: 220px; z-index: 60;
  }
  #actions-menu.open { display: block; }
  .actions-menu-item {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 9px 10px; border-radius: 8px; border: none;
    background: transparent; color: #555;
    font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px;
    cursor: pointer; transition: all .15s;
  }
  .actions-menu-item:hover { background: var(--paper2); color: var(--ink); }
  .actions-menu-item svg { flex-shrink: 0; color: #999; }

  /* &#9472;&#9472; CONTENT &#9472;&#9472; */
  #content { flex: 1; padding: 32px; }

  /* &#9472;&#9472; OVERVIEW CARDS &#9472;&#9472; */
  .stats-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: #fff; border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow);
    border: 1px solid var(--paper3);
  }
  .stat-card-label { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: .07em; }
  .stat-card-value { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-size: 32px; color: var(--ink); margin: 4px 0 2px; }
  .stat-card-sub { font-size: 12px; color: #bbb; }
  .stat-card-bar { height: 4px; background: var(--paper3); border-radius: 2px; margin-top: 12px; overflow: hidden; }
  .stat-card-bar-fill { height: 100%; border-radius: 2px; background: var(--gold); transition: width .6s ease; }

  /* &#9472;&#9472; SEASON ALERT &#9472;&#9472; */
  .season-alert {
    padding: 14px 20px; border-radius: var(--radius);
    margin-bottom: 24px; font-size: 13px;
    display: flex; align-items: flex-start; gap: 12px;
    border: 1px solid;
  }
  .season-alert.good { background: #f0fdf4; border-color: #86efac; color: #166534; }
  .season-alert.warn { background: #fffbeb; border-color: #fcd34d; color: #92400e; }
  .season-alert.bad { background: #fef2f2; border-color: #fca5a5; color: #991b1b; }

  /* &#9472;&#9472; TIMELINE VIEW &#9472;&#9472; */
  .timeline { position: relative; }

  .timeline-item {
    display: flex; gap: 24px; margin-bottom: 20px;
    animation: fadeIn .3s ease both;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

  .timeline-dot {
    width: 66px; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center;
    padding-top: 20px; position: relative; z-index: 1;
  }
  .timeline-dot-circle {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; border: 3px solid var(--paper);
    box-shadow: 0 0 0 2px var(--paper3);
  }
  .timeline-dot-line {
    width: 2px; flex: 1; min-height: 20px; background: var(--paper3); margin-top: 6px;
  }

  .timeline-card {
    flex: 1; background: #fff; border-radius: var(--radius);
    box-shadow: var(--shadow); border: 1px solid var(--paper3);
    overflow: hidden; cursor: pointer; transition: box-shadow .2s, transform .2s;
  }
  .timeline-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
  .timeline-card.expanded { box-shadow: var(--shadow-lg); }

  .card-header {
    padding: 16px 20px;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .card-country-tag {
    font-size: 10px; font-weight: 600; padding: 3px 8px;
    border-radius: 4px; letter-spacing: .05em;
    text-transform: uppercase; flex-shrink: 0; margin-top: 2px;
  }
  .card-title-wrap { flex: 1; }
  .card-title { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-size: 18px; }
  .card-meta { font-size: 12px; color: #999; margin-top: 2px; }
  .card-days-badge {
    background: var(--paper2); border-radius: 8px;
    padding: 4px 10px; font-size: 12px; color: #777;
    flex-shrink: 0;
  }

  .card-season-row {
    padding: 8px 20px 12px;
    display: flex; align-items: center; gap: 8px;
    border-top: 1px solid var(--paper2);
    font-size: 12px;
  }
  .card-season-badge {
    padding: 3px 10px; border-radius: 12px;
    font-size: 11px; font-weight: 500;
  }
  .ok-badge { background: #dcfce7; color: #166534; }
  .warn-badge { background: #fef9c3; color: #854d0e; }
  .bad-badge { background: #fee2e2; color: #991b1b; }
  .neutral-badge { background: var(--paper2); color: #666; }

  .card-body-wrap { padding: 0 20px 16px; }
  .card-description { font-size: 13px; color: #555; line-height: 1.6; margin-bottom: 12px; }

  .card-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .pill {
    font-size: 11px; padding: 4px 10px; border-radius: 20px;
    background: var(--paper2); color: #666;
  }
  .pill.highlight { background: var(--gold-light); color: #7a5010; font-weight: 500; }

  .card-images { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .card-image-thumb {
    width: 80px; height: 60px; border-radius: 8px;
    object-fit: cover; cursor: pointer;
    border: 2px solid transparent; transition: border-color .2s;
  }
  .card-image-thumb:hover { border-color: var(--gold); }
  .add-image-btn {
    width: 80px; height: 60px; border-radius: 8px;
    border: 2px dashed var(--paper3); background: var(--paper);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; cursor: pointer; color: #bbb;
    font-size: 10px; gap: 3px; transition: all .2s;
  }
  .add-image-btn:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-light); }

  .card-notes-wrap { margin-top: 8px; }
  .card-notes {
    width: 100%; min-height: 60px; padding: 10px 12px;
    border: 1px solid var(--paper3); border-radius: 8px;
    font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px;
    color: var(--ink); background: var(--paper);
    resize: vertical; outline: none;
    transition: border-color .2s;
  }
  .card-notes:focus { border-color: var(--gold); }
  .card-notes::placeholder { color: #ccc; }

  .card-budget-row {
    display: flex; justify-content: space-between;
    padding: 8px 12px; background: var(--paper);
    border-radius: 8px; font-size: 12px; color: #777;
    margin-top: 8px;
  }
  .card-budget-row strong { color: var(--ink); }

  .card-actions {
    display: flex; gap: 8px; margin-top: 12px;
    padding-top: 12px; border-top: 1px solid var(--paper2);
  }
  .card-action-btn {
    padding: 7px 14px; border-radius: 8px;
    border: 1px solid var(--paper3); background: transparent;
    font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 12px;
    cursor: pointer; color: #666; transition: all .15s;
    display: flex; align-items: center; gap: 6px;
  }
  .card-action-btn:hover { background: var(--paper2); color: var(--ink); }
  .card-action-btn.danger:hover { background: #fee2e2; color: var(--danger); border-color: #fca5a5; }
  .card-action-btn.primary {
    background: var(--ink); color: #fff; border-color: var(--ink);
  }
  .card-action-btn.primary:hover { background: #333; }

  /* &#9472;&#9472; BUDGET VIEW &#9472;&#9472; */
  .budget-view { max-width: 800px; }
  .budget-section-title {
    font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-size: 20px;
    margin-bottom: 16px; padding-bottom: 8px;
    border-bottom: 2px solid var(--paper3);
  }
  .budget-line {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; background: #fff;
    border-radius: 10px; margin-bottom: 8px;
    border: 1px solid var(--paper3); box-shadow: var(--shadow);
  }
  .budget-line-emoji { font-size: 20px; flex-shrink: 0; }
  .budget-line-label { flex: 1; font-size: 13px; }
  .budget-line-sub { font-size: 11px; color: #999; }
  .budget-line-amount { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-size: 20px; }
  .budget-line-edit {
    font-size: 12px; padding: 4px 8px; border-radius: 6px;
    border: 1px solid var(--paper3); background: var(--paper);
    font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; width: 80px; text-align: right;
    color: var(--ink); outline: none;
  }
  .budget-line-edit:focus { border-color: var(--gold); }
  .budget-total-card {
    background: var(--ink); color: #fff; border-radius: var(--radius);
    padding: 24px 28px; margin-top: 20px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .budget-total-label { font-size: 14px; color: rgba(255,255,255,.6); }
  .budget-total-value { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-size: 36px; color: var(--gold-light); }
  .budget-remaining { font-size: 13px; color: rgba(255,255,255,.5); margin-top: 4px; }

  /* &#9472;&#9472; MODALS &#9472;&#9472; */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(26,20,16,.6);
    backdrop-filter: blur(4px); z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--paper); border-radius: 16px;
    padding: 32px; width: 560px; max-width: 95vw;
    max-height: 90vh; overflow-y: auto;
    box-shadow: var(--shadow-lg);
    transform: scale(.95) translateY(12px);
    transition: transform .2s;
  }
  .modal-overlay.open .modal { transform: none; }
  .modal-title {
    font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-size: 24px;
    margin-bottom: 24px;
  }
  .form-row { margin-bottom: 16px; }
  .form-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; display: block; }
  .form-input, .form-select, .form-textarea {
    width: 100%; padding: 10px 14px; border-radius: 8px;
    border: 1.5px solid var(--paper3); background: #fff;
    font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 14px; color: var(--ink);
    outline: none; transition: border-color .2s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
  .form-textarea { min-height: 80px; resize: vertical; }
  .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
  .btn-cancel {
    padding: 10px 20px; border-radius: 8px;
    border: 1px solid var(--paper3); background: transparent;
    font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px;
    cursor: pointer; color: #777; transition: all .15s;
  }
  .btn-cancel:hover { background: var(--paper2); }
  .btn-save {
    padding: 10px 24px; border-radius: 8px;
    border: none; background: var(--ink); color: #fff;
    font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px;
    cursor: pointer; transition: background .15s;
  }
  .btn-save:hover { background: #333; }

  /* &#9472;&#9472; LIGHTBOX &#9472;&#9472; */
  #lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.9);
    z-index: 2000; display: flex; align-items: center;
    justify-content: center; opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  #lightbox.open { opacity: 1; pointer-events: all; }
  #lightbox img { max-width: 90vw; max-height: 85vh; border-radius: 8px; object-fit: contain; }
  #lightbox-close {
    position: absolute; top: 20px; right: 24px;
    color: rgba(255,255,255,.7); font-size: 32px; cursor: pointer;
    line-height: 1; background: none; border: none;
  }

  /* &#9472;&#9472; GITHUB SYNC STATUS &#9472;&#9472; */
  #sync-status {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--ink); color: #fff;
    padding: 10px 16px; border-radius: 10px;
    font-size: 12px; display: flex; align-items: center; gap: 8px;
    box-shadow: var(--shadow-lg); z-index: 500;
    opacity: 0; transform: translateY(8px);
    transition: all .3s;
  }
  #sync-status.show { opacity: 1; transform: none; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .sync-dot.saving { background: var(--warn); animation: pulse .8s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* &#9472;&#9472; ADD ETAPE button &#9472;&#9472; */
  .add-etape-timeline {
    display: flex; gap: 24px; margin-bottom: 20px; align-items: center;
  }
  .add-etape-btn-timeline {
    flex: 1; padding: 16px; border: 2px dashed var(--paper3);
    border-radius: var(--radius); background: transparent;
    cursor: pointer; font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 13px; color: #bbb; transition: all .2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .add-etape-btn-timeline:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-light); }


  /* ── CARTE ── */
  .carte-wrap { display: flex; flex-direction: column; gap: 0; }
  .carte-filters {
    background: #fff; border: 1px solid var(--paper3);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
    box-shadow: var(--shadow);
  }
  .filter-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .filter-row.indent { padding-left: 10px; border-left: 2px solid var(--paper2); margin-left: 2px; }
  .filter-row.tags { padding-top: 6px; border-top: 1px dashed var(--paper2); }
  .filter-row.bottom { padding-top: 8px; border-top: 1px solid var(--paper2); }

  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 11px; border-radius: 20px; cursor: pointer;
    border: 1.5px solid var(--paper3); background: #fff;
    font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 12px; color: #666;
    transition: all .15s; white-space: nowrap;
  }
  .chip b { font-weight: 600; font-size: 10px; opacity: .5; }
  .chip:hover { border-color: var(--c, var(--gold)); color: var(--ink); }
  .chip.on {
    background: var(--c, var(--ink)); border-color: var(--c, var(--ink));
    color: #fff; font-weight: 500;
  }
  .chip.on b { opacity: .75; }
  .chip.sm { font-size: 11px; padding: 5px 9px; }
  .chip.tag { font-size: 11px; padding: 4px 9px; border-radius: 6px; border-style: dashed; }
  .chip.tag.on { background: var(--ink); border-color: var(--ink); border-style: solid; }
  .chip.reset { border-color: transparent; color: #aaa; }
  .chip.reset:hover { color: var(--danger); }
  .chip.add { margin-left: auto; background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 500; }
  .chip.add:hover { background: #333; }

  .filter-search {
    flex: 1; min-width: 140px; padding: 7px 12px; border-radius: 8px;
    border: 1.5px solid var(--paper3); background: var(--paper);
    font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 12px; color: var(--ink); outline: none;
  }
  .filter-search:focus { border-color: var(--gold); }
  .filter-select {
    padding: 7px 10px; border-radius: 8px; border: 1.5px solid var(--paper3);
    background: var(--paper); font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 12px; color: var(--ink); outline: none; cursor: pointer;
  }
  .filter-count { font-size: 12px; color: #999; }
  .filter-count b { color: var(--ink); font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-size: 15px; }

  #map {
    height: 520px; position: relative; overflow: hidden;
    border-left: 1px solid var(--paper3); border-right: 1px solid var(--paper3);
    background: #dbe7ee;
  }
  #map-canvas { width: 100%; height: 100%; display: block; touch-action: none; }

  .map-ctrl {
    position: absolute; top: 10px; left: 10px; z-index: 5;
    display: flex; flex-direction: column; gap: 4px;
  }
  .map-ctrl button {
    width: 30px; height: 30px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--paper3); background: rgba(255,255,255,.94);
    color: var(--ink); font-size: 15px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.12); transition: background .15s;
  }
  .map-ctrl button:hover { background: #fff; border-color: var(--gold); }
  .map-zoom {
    position: absolute; top: 10px; right: 10px; z-index: 5;
    background: rgba(255,255,255,.9); border: 1px solid var(--paper3);
    border-radius: 6px; padding: 3px 7px; font-size: 10px; color: #999;
  }
  .map-attrib {
    position: absolute; bottom: 4px; right: 6px; z-index: 5;
    font-size: 9px; color: rgba(26,20,16,.45);
    background: rgba(255,255,255,.7); padding: 2px 6px; border-radius: 4px;
  }

  /* popup canvas */
  .map-popup {
    position: absolute; z-index: 6; width: 250px;
    background: #fff; border-radius: 10px; padding: 12px 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,.22);
    transform: translate(-50%, -100%);
    opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  .map-popup.open { opacity: 1; pointer-events: auto; }
  .map-popup::after {
    content: ''; position: absolute; bottom: -6px; left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 12px; height: 12px; background: #fff;
  }
  .pop-x {
    margin-left: auto; background: none; border: none; cursor: pointer;
    color: #bbb; font-size: 18px; line-height: 1; padding: 0 0 0 6px;
  }
  .pop-x:hover { color: var(--ink); }
  .pop-coords {
    font-size: 10px; color: #bbb; margin-top: 8px;
    font-family: ui-monospace, monospace;
  }

  /* traçage */
  .chip.trace.on { background: var(--gold); border-color: var(--gold); color: #fff; }
  .trace-panel {
    border-top: 1px solid var(--paper2); margin-top: 8px; padding-top: 10px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .trace-head { display: flex; flex-direction: column; gap: 3px; }
  .trace-head strong { font-size: 12px; color: var(--gold); }
  .trace-hint { font-size: 11px; color: #aaa; line-height: 1.45; }
  .trace-stats { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 11px; color: #888; }
  .trace-stats b { color: var(--ink); font-size: 13px; }
  .trace-stats button, .trace-actions button {
    padding: 4px 9px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--paper3); background: #fff;
    font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 11px; color: #666;
  }
  .trace-stats button:hover, .trace-actions button:hover { border-color: var(--gold); color: var(--ink); }
  .trace-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .trace-z { font-size: 11px; color: #888; display: flex; align-items: center; gap: 5px; }
  .trace-z input {
    padding: 5px 6px; border-radius: 6px; border: 1.5px solid var(--paper3);
    font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 11px; background: var(--paper);
  }
  .trace-out {
    width: 100%; min-height: 76px; resize: vertical;
    border: 1px solid var(--paper3); border-radius: 8px; padding: 8px 10px;
    font-family: ui-monospace, monospace; font-size: 10px; line-height: 1.5;
    background: var(--paper); color: #555; outline: none;
  }
  .trace-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .trace-actions code { background: var(--paper2); padding: 1px 4px; border-radius: 3px; }
  .trace-list { display: flex; flex-wrap: wrap; gap: 5px; }
  .patch-chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; background: var(--gold-light); color: #7a5010;
    padding: 3px 8px; border-radius: 5px;
  }
  .patch-chip button { background: none; border: none; cursor: pointer; color: #7a5010; padding: 0; font-size: 13px; }

  /* liste sous la carte */
  .poi-list {
    background: #fff; border: 1px solid var(--paper3); border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    max-height: 300px; overflow-y: auto; box-shadow: var(--shadow);
  }
  .poi-group-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: #aaa; padding: 10px 14px 4px; background: var(--paper);
    position: sticky; top: 0; z-index: 2;
  }
  .poi-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px; cursor: pointer; border-top: 1px solid var(--paper2);
    transition: background .15s;
  }
  .poi-row:hover { background: var(--paper); }
  .poi-row-pin {
    width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 12px;
  }
  .poi-row-body { flex: 1; min-width: 0; }
  .poi-row-title { font-size: 13px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .poi-row-sub { font-size: 11px; color: #aaa; }
  .poi-row-tag { font-size: 12px; }
  .poi-empty { padding: 28px; text-align: center; color: #bbb; font-size: 13px; }

  /* tags dans le modal */
  .tag-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-check {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 10px; border-radius: 6px; cursor: pointer;
    border: 1.5px dashed var(--paper3); background: #fff;
    font-size: 11px; color: #666; transition: all .15s; user-select: none;
  }
  .tag-check:hover { border-color: var(--gold); }
  .tag-check.on { background: var(--ink); border-color: var(--ink); border-style: solid; color: #fff; }
  .tag-check input { display: none; }
  .form-hint { font-size: 11px; color: #aaa; margin-top: 5px; line-height: 1.4; }
  .form-error { font-size: 12px; color: var(--danger); min-height: 16px; margin-top: 4px; }

  .poi-cluster-wrap { background: none; border: none; }
  .poi-cluster {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--ink); color: #fff; border: 2px solid #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 500;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  .map-fallback {
    height: 100%; display: flex; flex-direction: column; gap: 10px;
    align-items: center; justify-content: center; color: #aaa;
    font-size: 13px; text-align: center; line-height: 1.6;
  }
  .map-fallback div { font-size: 32px; opacity: .5; }

  /* ── ÉQUIPEMENT ── */
  .equip-wrap { display: flex; flex-direction: column; gap: 18px; }
  .equip-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    background: #fff; border: 1px solid var(--paper3); border-radius: var(--radius);
    padding: 10px 12px; box-shadow: var(--shadow);
  }
  .equip-crumbs { display: flex; align-items: center; gap: 4px; flex: 1; flex-wrap: wrap; min-width: 0; }
  .crumb {
    background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: 6px;
    font-family: 'DM Sans', system-ui, sans-serif; font-size: 12px; color: #999; transition: all .15s;
  }
  .crumb:hover { background: var(--paper2); color: var(--ink); }
  .crumb.on { color: var(--ink); font-weight: 500; background: var(--paper2); }
  .crumb-sep { color: #ddd; font-size: 12px; }

  /* le "zoom" sur un élément */
  .equip-focus {
    display: flex; gap: 24px; background: #fff;
    border: 1px solid var(--paper3); border-radius: var(--radius);
    padding: 24px; box-shadow: var(--shadow);
    animation: equipIn .25s ease both;
  }
  @keyframes equipIn { from { opacity:0; transform: scale(.985); } to { opacity:1; transform:none; } }
  .equip-focus-visual {
    width: 190px; height: 190px; flex-shrink: 0; border-radius: 12px;
    background: var(--paper2); overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .equip-focus-visual img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
  .equip-focus-emoji { font-size: 76px; }
  .equip-focus-body { flex: 1; min-width: 0; }
  .equip-focus-type {
    font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: #bbb;
  }
  .equip-focus-title {
    font-family: 'Playfair Display', Georgia, serif; font-size: 27px;
    margin: 2px 0 8px; line-height: 1.15;
  }
  .equip-focus-note { font-size: 13px; color: #666; line-height: 1.6; margin-bottom: 12px; }
  .equip-stats { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 14px; }
  .equip-stats span { font-size: 12px; color: #999; }
  .equip-stats b {
    font-family: 'Playfair Display', Georgia, serif; font-size: 17px;
    color: var(--ink); margin-right: 3px;
  }
  .equip-focus-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* liens */
  .equip-links { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .equip-link {
    display: flex; align-items: center; gap: 10px; text-decoration: none;
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--paper3);
    background: var(--paper); transition: all .15s;
  }
  .equip-link:hover { border-color: var(--gold); background: var(--gold-light); }
  .equip-link-host {
    font-size: 10px; color: #fff; background: var(--ink);
    padding: 2px 6px; border-radius: 4px; flex-shrink: 0;
  }
  .equip-link-label { font-size: 12px; color: var(--ink); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .equip-link-prix { font-size: 12px; color: var(--gold); font-weight: 500; flex-shrink: 0; }

  /* grille des enfants */
  .equip-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px;
  }
  .equip-card {
    background: #fff; border: 1px solid var(--paper3); border-radius: var(--radius);
    overflow: hidden; cursor: pointer; box-shadow: var(--shadow);
    transition: transform .18s, box-shadow .18s;
  }
  .equip-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .equip-card-visual {
    height: 120px; background: var(--paper2); position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .equip-card-visual img { width: 100%; height: 100%; object-fit: cover; }
  .equip-card-emoji { font-size: 44px; }
  .equip-badge {
    position: absolute; top: 8px; right: 8px;
    background: var(--ink); color: #fff; font-size: 10px;
    min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px;
    display: flex; align-items: center; justify-content: center;
  }
  .equip-card-body { padding: 11px 13px; }
  .equip-card-title { font-size: 13px; color: var(--ink); margin-bottom: 2px; }
  .equip-card-meta { font-size: 11px; color: #aaa; }
  .equip-card-links { font-size: 10px; color: var(--gold); margin-top: 4px; }
  .equip-empty {
    padding: 48px; text-align: center; color: #bbb; font-size: 14px; line-height: 1.9;
    background: #fff; border: 2px dashed var(--paper3); border-radius: var(--radius);
  }
  .equip-empty span { font-size: 12px; color: #ccc; }

  /* liens dans le modal */
  .link-add { display: grid; grid-template-columns: 1fr 100px 72px 40px; gap: 6px; }
  .link-add .btn-save { padding: 0; font-size: 17px; }
  .draft-links { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
  .draft-link {
    display: flex; align-items: center; gap: 8px;
    background: var(--paper); border: 1px solid var(--paper3);
    border-radius: 6px; padding: 5px 8px;
  }
  .draft-link-host { font-size: 9px; background: var(--ink); color: #fff; padding: 1px 5px; border-radius: 3px; }
  .draft-link-label { font-size: 11px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .draft-link-prix { font-size: 11px; color: var(--gold); }
  .draft-link button { background: none; border: none; cursor: pointer; color: #ccc; font-size: 15px; padding: 0; }
  .draft-link button:hover { color: var(--danger); }
  .draft-empty { font-size: 11px; color: #ccc; padding: 4px 2px; }

  /* photo objet : URL + import fichier */
  .ef-photo-row { display: grid; grid-template-columns: 1fr 44px; gap: 6px; }
  .ef-photo-upload {
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--paper3); border-radius: 8px;
    background: var(--paper); color: #999; cursor: pointer; transition: all .15s;
  }
  .ef-photo-upload:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-light); }
  .ef-photo-preview { margin-top: 8px; }
  .ef-photo-preview img {
    height: 72px; width: 72px; object-fit: cover; border-radius: 8px;
    border: 1px solid var(--paper3);
  }
  .ef-photo-preview .ef-photo-clear {
    margin-left: 8px; font-size: 11px; color: #999; background: none;
    border: none; cursor: pointer; text-decoration: underline; vertical-align: top;
  }
  .ef-photo-preview .ef-photo-clear:hover { color: var(--danger); }

  /* ── RESPONSIVE ── */
  @media (max-width: 1100px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 860px) {
    #main { margin-left: 0; }
    #topbar { padding: 12px 16px; gap: 10px; flex-wrap: wrap; }
    #topbar-title { font-size: 17px; flex: 1 1 auto; }
    .season-pill { font-size: 11px; padding: 5px 10px; }
    #season-menu { left: auto; right: 0; }
    #topbar-views { width: 100%; order: 3; }
    .view-btn { flex: 1; }
    #content { padding: 16px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
    .stat-card { padding: 14px; }
    .stat-card-value { font-size: 24px; }
    .timeline-item { gap: 12px; }
    .timeline-dot { width: 44px; }
    .timeline-dot-circle { width: 32px; height: 32px; font-size: 15px; }
    .add-etape-timeline { gap: 12px; }
    .add-etape-timeline > div:first-child { width: 44px !important; }
    .card-actions { flex-wrap: wrap; }
    .card-action-btn { flex: 1 1 auto; justify-content: center; }
    .budget-line { flex-wrap: wrap; }
    .budget-total-card { flex-direction: column; align-items: flex-start; gap: 16px; }
    .budget-total-card > div:last-child { text-align: left !important; }
    .modal { padding: 20px; border-radius: 12px; }
    #map { height: 380px; }
    .equip-focus { flex-direction: column; gap: 16px; }
    .equip-focus-visual { width: 100%; height: 160px; }
    .equip-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .link-add { grid-template-columns: 1fr 40px; }
    .link-add input:nth-child(2), .link-add input:nth-child(3) { grid-column: 1; }
    .chip.add { margin-left: 0; width: 100%; justify-content: center; }
    .filter-row.bottom { gap: 8px; }
    .filter-search { min-width: 0; }
    .poi-list { max-height: 240px; }
    .carte-filters { padding: 10px; }
  }

  @media (max-width: 420px) {
    .stats-grid { grid-template-columns: 1fr; }
    .form-row-2 { grid-template-columns: 1fr; }
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--paper3); border-radius: 3px; }
</style>
</head>
<body>

<!-- MAIN -->
<main id="main">
  <header id="topbar">
    <div id="topbar-title">Th&#233;o &amp; Valentine <span>en Asie</span></div>

    <!-- Période de voyage (déplacé depuis l'ancienne barre latérale) -->
    <div id="season-picker">
      <button class="season-pill" id="season-pill-btn" onclick="toggleSeasonMenu(event)">
        <span class="season-dot" id="season-pill-dot"></span>
        <span id="season-pill-label">&#8230;</span>
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div id="season-menu">
        <div class="season-menu-label">P&#233;riode de voyage</div>
        <button class="season-menu-item" data-season="nov-avril" style="--active-color:#22c55e" onclick="setSeason('nov-avril'); closeSeasonMenu()">
          <span class="season-dot" style="background:#22c55e"></span>Nov &#8594; Avril &#10003;
        </button>
        <button class="season-menu-item" data-season="juil-aout" style="--active-color:#f59e0b" onclick="setSeason('juil-aout'); closeSeasonMenu()">
          <span class="season-dot" style="background:#f59e0b"></span>Juil &#8594; Ao&#251;t &#9888;
        </button>
        <button class="season-menu-item" data-season="sept-oct" style="--active-color:#f97316" onclick="setSeason('sept-oct'); closeSeasonMenu()">
          <span class="season-dot" style="background:#f97316"></span>Sept &#8594; Oct &#9888;
        </button>
      </div>
    </div>

    <div id="topbar-views">
      <button class="view-btn active" data-view="timeline" onclick="setView('timeline')">Timeline</button>
      <button class="view-btn" data-view="carte" onclick="setView('carte')">Carte</button>
      <button class="view-btn" data-view="equip" onclick="setView('equip')">Équipement</button>
      <button class="view-btn" data-view="budget" onclick="setView('budget')">Budget</button>
    </div>

    <!-- Menu d'actions (déplacé depuis l'ancien pied de barre latérale) -->
    <div id="topbar-actions">
      <button class="topbar-menu-btn" id="actions-btn" onclick="toggleActionsMenu(event)" aria-label="Actions">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
      </button>
      <div id="actions-menu">
        <button class="actions-menu-item" onclick="openAddModal(); closeActionsMenu()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          Ajouter une &#233;tape
        </button>
        <button class="actions-menu-item" onclick="syncGithub(); closeActionsMenu()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
          Sync GitHub
        </button>
        <button class="actions-menu-item" onclick="resetToken(); closeActionsMenu()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Changer token GitHub
        </button>
        <button class="actions-menu-item" onclick="exportData(); closeActionsMenu()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Exporter JSON
        </button>
      </div>
    </div>
  </header>

  <div id="content">
    <!-- Stats -->
    <div class="stats-grid" id="stats-grid"></div>
    <!-- Season alert -->
    <div id="season-alert-box"></div>
    <!-- Main view -->
    <div id="view-container"></div>
  </div>
</main>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="closeLightbox()">
  <button id="lightbox-close" onclick="closeLightbox()">&#215;</button>
  <img id="lightbox-img" src="" alt="">
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <h2 class="modal-title" id="modal-title">Nouvelle &#233;tape</h2>
    <div class="form-row-2">
      <div class="form-row">
        <label class="form-label">Emoji</label>
        <input class="form-input" id="f-emoji" placeholder="ex: &#127965;" value="">
      </div>
      <div class="form-row">
        <label class="form-label">Pays</label>
        <select class="form-select" id="f-pays">
          <option value="Philippines">Philippines &#127477;&#127469;</option>
          <option value="Malaisie">Malaisie &#127474;&#127486;</option>
          <option value="Bali">Bali &#127470;&#127465;</option>
          <option value="Singapour">Singapour &#127480;&#127468;</option>
          <option value="Autre">Autre</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <label class="form-label">Ville / Lieu</label>
      <input class="form-input" id="f-ville" placeholder="El Nido">
    </div>
    <div class="form-row-2">
      <div class="form-row">
        <label class="form-label">Dur&#233;e (jours)</label>
        <input class="form-input" id="f-duree" type="number" min="1" value="3">
      </div>
      <div class="form-row">
        <label class="form-label">Budget/jour (&#8364;)</label>
        <input class="form-input" id="f-budget" type="number" min="0" value="35">
      </div>
    </div>
    <div class="form-row">
      <label class="form-label">Description</label>
      <textarea class="form-textarea" id="f-description" placeholder="Ce que vous allez faire ici..."></textarea>
    </div>
    <div class="form-row">
      <label class="form-label">Activit&#233;s (s&#233;par&#233;es par des virgules)</label>
      <input class="form-input" id="f-activites" placeholder="Snorkeling, Temple, Randonn&#233;e">
    </div>
    <div class="form-row-2">
      <div class="form-row">
        <label class="form-label">M&#233;t&#233;o Nov&#8211;Avril</label>
        <input class="form-input" id="f-s1" placeholder="&#9728;&#65039; Sec 29&#176;C">

async function init() {
  DATA = await loadData();
  ensurePois();
  ensurePatches();

  currentSeason = DATA.meta.saison_active || 'nov-avril';
  render();
}

async function loadData() {
  // 1. Try GitHub (works without token if repo is public)
  try {
    const headers = { Accept: 'application/vnd.github.v3+json' };
    const tok = getToken();
    if (tok) headers.Authorization = `token ${tok}`;
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/data/voyage.json`, { headers });
    if (r.ok) {
      const j = await r.json();
      const remote = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\s/g,'')))));
      if (remote && remote.etapes) return remote;
    }
  } catch(e) {}
  // 2. Fallback: local draft
  try {
    const local = localStorage.getItem('voyage-asie-data');
    if (local) {
      const parsed = JSON.parse(local);
      if (parsed && parsed.etapes) return parsed;
    }
  } catch(e) {}
  // 3. Fallback: embedded defaults
  return getDefaultData();
}

// \u2500\u2500 EMOJI SETTER (avoids innerHTML encoding issues) \u2500\u2500
function setEmojis() {
  const emojiMap = {};
  const seasonMap = {};
  DATA.etapes.forEach(e => {
    emojiMap[e.id] = e.emoji;
    seasonMap[e.id] = e.saisons?.[currentSeason] || {};
  });
  // Etape emojis in dots, grid, budget
  document.querySelectorAll('[data-set-emoji]').forEach(el => {
    const id = el.dataset.setEmoji.replace(/-dot$|-grid$/, '');
    if (emojiMap[id]) el.textContent = emojiMap[id];
  });
  // Fixed budget emojis
  const fixedEmojis = ['✈️','🛫','⭐','🏥','💉','📋','🎲'];
  document.querySelectorAll('[data-set-emoji2]').forEach(el => {
    const idx = parseInt(el.dataset.setEmoji2.replace('fixed-',''));
    if (fixedEmojis[idx] !== undefined) el.textContent = fixedEmojis[idx];
  });
  // Meteo and conseil text (contains emojis from data)
  document.querySelectorAll('[data-set-meteo]').forEach(el => {
    const s = seasonMap[el.dataset.setMeteo];
    if (s) el.textContent = s.meteo || '';
  });
  document.querySelectorAll('[data-set-conseil]').forEach(el => {
    const s = seasonMap[el.dataset.setConseil];
    if (s) el.textContent = s.conseil || '';
  });

  document.querySelectorAll('[data-set-highlight]').forEach(el => {
    const e = DATA.etapes.find(x => x.id === el.dataset.setHighlight);
    if (e) el.textContent = e.highlight || '';
  });
}

const BUDGET_KEYS = ['vol_ar','vols_internes','activites_phares','assurance','vaccins','visas','imprevu'];

function computeTotals() {
  const life = DATA.etapes.reduce((s,e) => s + (e.cout_fixe || (e.budget_jour||0) * (e.duree||0)), 0);
  const fixed = BUDGET_KEYS.reduce((s,k) => s + (DATA.budget[k]||0), 0);
  const grand = fixed + life;
  return { life, fixed, grand, reste: (DATA.meta.budget_total||0) - grand };
}

function renderStats() {
  const days = totalDays();
  const { grand: totalSpend, reste } = computeTotals();

  document.getElementById('stats-grid').innerHTML = `

    </div>

function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function seasonBadgeClass(conseil) {
  if (conseil.includes('🚫')) return 'bad-badge';
  if (conseil.includes('⭐')) return 'ok-badge';
  if (conseil.includes('⚠')) return 'warn-badge';

}

function buildBudget() {
  const sorted = [...DATA.etapes].sort((a,b) => a.ordre - b.ordre);
  const b = DATA.budget;

  // Fixed costs
  const fixed = [
    { emoji:'\u2708\ufe0f', label:'Vol Bruxelles \u2192 KL (A/R)', sub:'Point d\'entr\u00e9e', key:'vol_ar', val:b.vol_ar||550 },
    { emoji:'🛫', label:'Vols internes', sub:'Entre les \u00eeles et pays', key:'vols_internes', val:b.vols_internes||340 },
    { emoji:'\u2b50', label:'Activit\u00e9s phares', sub:'Croisi\u00e8re, mantas, requins baleines...', key:'activites_phares', val:b.activites_phares||415 },
    { emoji:'🏥', label:'Assurance voyage', sub:'Rapatriement m\u00e9dical inclus', key:'assurance', val:b.assurance||100 },
    { emoji:'💉', label:'Vaccins', sub:'H\u00e9patite A, typho\u00efde, rage...', key:'vaccins', val:b.vaccins||200 },
    { emoji:'📋', label:'Visas', sub:'Vietnam + Cambodge si applicable', key:'visas', val:b.visas||60 },
    { emoji:'🎲', label:'Impr\u00e9vus', sub:'Marge de s\u00e9curit\u00e9', key:'imprevu', val:b.imprevu||300 },
  ];

  let lifeTotal = 0;
  const lifeLines = sorted.map(e => {
    const cout = e.cout_fixe || (e.budget_jour * e.duree);
    lifeTotal += cout;
    return { e, cout };
  });

  const { grand, reste } = computeTotals();

  let html = '<div class="budget-view">';

  html += '<div class="budget-section-title">Co\u00fbts fixes</div>';
  fixed.forEach((f, fi) => {
    html += `<div class="budget-line">
      <span class="budget-line-emoji" data-set-emoji2="fixed-${fi}"></span>
      <div style="flex:1">
        <div class="budget-line-label" style="font-weight:500">${f.label}</div>
        <div class="budget-line-sub">${f.sub}</div>
      </div>
      <input class="budget-line-edit" type="number" value="${f.val}"
        onchange="updateBudgetKey('${f.key}', this.value)" onclick="event.stopPropagation()">
      <span class="budget-line-amount" style="margin-left:8px;min-width:60px;text-align:right">${f.val.toLocaleString()} \u20ac</span>
    </div>`;
  });

  html += '<div class="budget-section-title" style="margin-top:28px">Vie courante par \u00e9tape</div>';
  lifeLines.forEach(({e,cout}) => {
    const code = e.pays_code || COUNTRY_CODES[e.pays] || '??';
    const color = e.couleur || COUNTRY_COLORS[code] || '#888';
    html += `<div class="budget-line">
      <span class="budget-line-emoji" data-set-emoji="${e.id}-dot"></span>
      <div style="flex:1">
        <div class="budget-line-label" style="font-weight:500">${esc(e.ville)}</div>
        <div class="budget-line-sub">${e.cout_fixe?'Forfait inclus':e.budget_jour+'\u20ac/jour \u00d7 '+e.duree+' jours'}</div>
      </div>
      ${!e.cout_fixe?`<input class="budget-line-edit" type="number" value="${e.budget_jour}"
        onchange="updateEtapeBudget('${e.id}', this.value)" onclick="event.stopPropagation()">`:
        '<span style="width:80px;text-align:right;font-size:12px;color:#bbb">forfait</span>'}
      <span class="budget-line-amount" style="margin-left:8px;min-width:60px;text-align:right;color:${color}">${cout.toLocaleString()} \u20ac</span>
    </div>`;
  });

  html += `
  <div class="budget-total-card">
    <div>
      <div class="budget-total-label">Total estim\u00e9</div>
      <div class="budget-total-value">${grand.toLocaleString()} \u20ac</div>
      <div class="budget-remaining">sur ${DATA.meta.budget_total.toLocaleString()} \u20ac \u00b7 marge : <strong style="color:${reste>0?'#6ee7b7':'#fca5a5'}">${reste.toLocaleString()} \u20ac</strong></div>
    </div>
    <div style="text-align:right">
      <div class="budget-total-label">Budget/jour moyen</div>
      <div style="font-family:'Playfair Display',serif;font-size:28px;color:var(--gold-light)">${totalDays() ? Math.round(grand/totalDays()) : 0} \u20ac</div>
    </div>
  </div>`;

  html += '</div>';
  return html;
}


// Garantit la présence des POI et fusionne les nouveaux spots seedés
// sans écraser les modifs de l'utilisateur.
function ensurePatches() {
  if (!Array.isArray(DATA.patches)) DATA.patches = [];
}

function ensurePois() {
  if (!Array.isArray(DATA.pois)) { DATA.pois = getSeedPois(); return; }
  const have = new Set(DATA.pois.map(p => p.id));
  getSeedPois().forEach(sp => { if (!have.has(sp.id)) DATA.pois.push(sp); });
}

// ══════════════════════════════════════════════════════════════
//  ÉQUIPEMENT — arbre de profondeur libre
//  Un nœud peut contenir des nœuds, qui contiennent des nœuds…
//  Racine : Théo, Valentine, le sac. Dedans : la gourde, etc.
// ══════════════════════════════════════════════════════════════

let equipPath = [];        // chemin de zoom : ['sac','gourde', ...]
let editingEquipId = null;

function defaultEquip() {
  return [
    { id: 'theo', nom: 'Théo', type: 'personne', emoji: '🧍',
      note: 'Ce que je porte sur moi / mes affaires perso.', photo: '', items: [] },
    { id: 'valentine', nom: 'Valentine', type: 'personne', emoji: '🧍‍♀️',
      note: 'Ses affaires à elle.', photo: '', items: [] },
    { id: 'sac', nom: 'Le sac', type: 'objet', emoji: '🎒',
      note: 'Le sac principal et tout ce qu\'il contient.', photo: '',
      liens: [], items: [] }
  ];
}

function ensureEquip() {
  if (!Array.isArray(DATA.equip) || !DATA.equip.length) DATA.equip = defaultEquip();
  const fix = n => {
    if (!Array.isArray(n.items)) n.items = [];
    if (!Array.isArray(n.liens)) n.liens = [];
    n.items.forEach(fix);
  };
  DATA.equip.forEach(fix);
}

// ── navigation dans l'arbre ──
function equipNodeAt(path) {
  let list = DATA.equip, node = null;
  for (const id of path) {
    node = list.find(n => n.id === id);
    if (!node) return null;
    list = node.items;
  }
  return node;
}
function equipListAt(path) {
  const n = equipNodeAt(path);
  return n ? n.items : DATA.equip;
}
function equipDrill(id) { equipPath.push(id); renderView(); }
function equipUp() { equipPath.pop(); renderView(); }
function equipGoTo(i) { equipPath = equipPath.slice(0, i); renderView(); }

// ── agrégats : un sac coûte ce qu'il contient ──
function equipTotal(node) {
  let sum = +node.prix || 0;
  (node.items || []).forEach(c => sum += equipTotal(c));
  return sum;
}
function equipCount(node) {
  let n = (node.items || []).length;
  (node.items || []).forEach(c => n += equipCount(c));
  return n;
}
function equipWeight(node) {
  let w = +node.poids || 0;
  (node.items || []).forEach(c => w += equipWeight(c));
  return w;
}

function fmtWeight(g) {
  if (!g) return '';
  return g >= 1000 ? (g/1000).toFixed(g % 1000 ? 1 : 0) + ' kg' : g + ' g';
}

// ── vue ──
function buildEquip() {
  ensureEquip();
  const node = equipNodeAt(equipPath);
  const list = equipListAt(equipPath);

  // fil d'ariane
  let crumbs = `<button class="crumb ${equipPath.length?'':'on'}" onclick="equipGoTo(0)">Tout</button>`;
  equipPath.forEach((id, i) => {
    const n = equipNodeAt(equipPath.slice(0, i+1));
    if (!n) return;
    crumbs += `<span class="crumb-sep">›</span>
      <button class="crumb ${i===equipPath.length-1?'on':''}" onclick="equipGoTo(${i+1})">${n.emoji||''} ${esc(n.nom)}</button>`;
  });

  // en-tête du nœud courant (le "zoom")
  let head = '';
  if (node) {
    const total = equipTotal(node), cnt = equipCount(node), w = equipWeight(node);
    head = `
    <div class="equip-focus">
      <div class="equip-focus-visual">
        ${node.photo
          ? `<img src="${esc(node.photo)}" alt="${esc(node.nom)}" onclick="openLightbox('${esc(node.photo)}', event)">`
          : `<div class="equip-focus-emoji">${node.emoji||'📦'}</div>`}
      </div>
      <div class="equip-focus-body">
        <div class="equip-focus-type">${esc(node.type||'')}</div>
        <h2 class="equip-focus-title">${esc(node.nom)}</h2>
        ${node.note?`<p class="equip-focus-note">${esc(node.note)}</p>`:''}
        <div class="equip-stats">
          ${node.prix?`<span><b>${(+node.prix).toLocaleString()} €</b> l'objet</span>`:''}
          ${cnt?`<span><b>${cnt}</b> élément${cnt>1?'s':''} dedans</span>`:''}
          ${total?`<span><b>${total.toLocaleString()} €</b> au total</span>`:''}
          ${w?`<span><b>${fmtWeight(w)}</b> au total</span>`:''}
        </div>
        ${(node.liens||[]).length?`<div class="equip-links">
          ${node.liens.map((l,i)=>`<a class="equip-link" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">
            <span class="equip-link-host">${esc(linkHost(l.url))}</span>
            <span class="equip-link-label">${esc(l.label||l.url)}</span>
            ${l.prix?`<span class="equip-link-prix">${esc(l.prix)}</span>`:''}
          </a>`).join('')}
        </div>`:''}
        <div class="equip-focus-actions">
          <button class="card-action-btn primary" onclick="openEquipModal(null, ${JSON.stringify(equipPath).replace(/"/g,'&quot;')})">+ Ajouter dedans</button>
          <button class="card-action-btn" onclick="openEquipModal('${node.id}')">Modifier</button>
          ${node.source==='user'?`<button class="card-action-btn danger" onclick="deleteEquip('${node.id}')">Supprimer</button>`:''}
        </div>
      </div>
    </div>`;
  }

  // grille des enfants
  const cards = list.map(n => {
    const total = equipTotal(n), cnt = equipCount(n), w = equipWeight(n);
    return `
    <div class="equip-card" onclick="equipDrill('${n.id}')">
      <div class="equip-card-visual">
        ${n.photo ? `<img src="${esc(n.photo)}" alt="">`
                  : `<span class="equip-card-emoji">${n.emoji||'📦'}</span>`}
        ${cnt?`<span class="equip-badge">${cnt}</span>`:''}
      </div>
      <div class="equip-card-body">
        <div class="equip-card-title">${esc(n.nom)}</div>
        <div class="equip-card-meta">
          ${total?`${total.toLocaleString()} €`:'—'}${w?` · ${fmtWeight(w)}`:''}
        </div>
        ${(n.liens||[]).length?`<div class="equip-card-links">🔗 ${n.liens.length} lien${n.liens.length>1?'s':''}</div>`:''}
      </div>
    </div>`;
  }).join('');

  const emptyMsg = node
    ? `Rien dans ${esc(node.nom)} pour l'instant.`
    : `Aucun élément.`;

  return `
  <div class="equip-wrap">
    <div class="equip-bar">
      <div class="equip-crumbs">${crumbs}</div>
      ${equipPath.length?`<button class="chip" onclick="equipUp()">↑ Remonter</button>`:''}
      <button class="chip add" onclick="openEquipModal(null, ${JSON.stringify(equipPath).replace(/"/g,'&quot;')})">+ Ajouter</button>
    </div>
    ${head}
    ${list.length
      ? `<div class="equip-grid">${cards}</div>`
      : `<div class="equip-empty">${emptyMsg}<br><span>Clique sur « + Ajouter » pour commencer.</span></div>`}
  </div>`;
}

function linkHost(url) {
  try { return new URL(url).hostname.replace(/^www\./,''); }
  catch(e) { return 'lien'; }
}

// ── ajout / édition ──
let equipDraftLinks = [];
let equipTargetPath = [];
let equipDraftPhoto = '';   // photo en cours d'édition (URL ou dataURL)

function openEquipModal(id, path) {
  editingEquipId = id || null;
  equipTargetPath = path || equipPath;
  const node = id ? findEquipById(DATA.equip, id) : null;

  document.getElementById('equip-modal-title').textContent = node ? 'Modifier' : 'Nouvel élément';
  document.getElementById('ef-nom').value = node?.nom || '';
  document.getElementById('ef-emoji').value = node?.emoji || '';
  document.getElementById('ef-type').value = node?.type || 'objet';
  document.getElementById('ef-prix').value = node?.prix || '';
  document.getElementById('ef-poids').value = node?.poids || '';
  document.getElementById('ef-note').value = node?.note || '';

  // Photo : on repart TOUJOURS de zéro pour cet objet précis (jamais partagé)
  equipDraftPhoto = node?.photo || '';
  const photoInput = document.getElementById('ef-photo');
  // Si c'est une image importée (dataURL), on ne l'affiche pas dans le champ texte
  photoInput.value = /^data:image\//i.test(equipDraftPhoto) ? '' : equipDraftPhoto;
  const photoFile = document.getElementById('ef-photo-file');
  if (photoFile) photoFile.value = '';
  renderPhotoPreview();

  // Liens : copie profonde, jamais de référence partagée entre objets
  equipDraftLinks = (node?.liens || []).map(l => ({ ...l }));
  // On vide le brouillon de lien en cours (champs de saisie du lien)
  ['ef-link-url', 'ef-link-label', 'ef-link-prix'].forEach(fid => {
    const el = document.getElementById(fid);
    if (el) el.value = '';
  });
  renderDraftLinks();

  document.getElementById('ef-error').textContent = '';
  document.getElementById('equip-modal-overlay').classList.add('open');
}

// Aperçu de la photo de l'objet en cours d'édition
function renderPhotoPreview() {
  const box = document.getElementById('ef-photo-preview');
  if (!box) return;
  if (equipDraftPhoto) {
    box.innerHTML = '';
    const img = document.createElement('img');
    img.src = equipDraftPhoto;
    img.alt = 'Aperçu';
    const btn = document.createElement('button');
    btn.className = 'ef-photo-clear';
    btn.type = 'button';
    btn.textContent = 'Retirer';
    btn.onclick = clearEquipPhoto;
    box.appendChild(img);
    box.appendChild(btn);
  } else {
    box.innerHTML = '';
  }
}

function clearEquipPhoto() {
  equipDraftPhoto = '';
  const pi = document.getElementById('ef-photo');
  if (pi) pi.value = '';
  const pf = document.getElementById('ef-photo-file');
  if (pf) pf.value = '';
  renderPhotoPreview();
}
function closeEquipModal() { document.getElementById('equip-modal-overlay').classList.remove('open'); }
function closeEquipModalOutside(e) { if (e.target === e.currentTarget) closeEquipModal(); }

function findEquipById(list, id) {
  for (const n of list) {
    if (n.id === id) return n;
    const f = findEquipById(n.items || [], id);
    if (f) return f;
  }
  return null;
}
function findEquipParent(list, id, parent) {
  for (const n of list) {
    if (n.id === id) return parent;
    const f = findEquipParent(n.items || [], id, n);
    if (f !== undefined && f !== null) return f;
  }
  return null;
}

// liens en cours d'édition
function addDraftLink() {
  const url = document.getElementById('ef-link-url').value.trim();
  const label = document.getElementById('ef-link-label').value.trim();
  const prix = document.getElementById('ef-link-prix').value.trim();
  const err = document.getElementById('ef-error');
  if (!url) { err.textContent = 'Colle une URL.'; return; }
  const norm = normalizeUrl(url);
  if (!norm) { err.textContent = 'URL invalide. Elle doit ressembler à https://…'; return; }
  equipDraftLinks.push({ url: norm, label: label || linkHost(norm), prix });
  document.getElementById('ef-link-url').value = '';
  document.getElementById('ef-link-label').value = '';
  document.getElementById('ef-link-prix').value = '';
  err.textContent = '';
  renderDraftLinks();
}
function removeDraftLink(i) { equipDraftLinks.splice(i,1); renderDraftLinks(); }
function renderDraftLinks() {
  const el = document.getElementById('ef-links');
  if (!el) return;
  el.innerHTML = equipDraftLinks.length
    ? equipDraftLinks.map((l,i)=>`<div class="draft-link">
        <span class="draft-link-host">${esc(linkHost(l.url))}</span>
        <span class="draft-link-label">${esc(l.label)}</span>
        ${l.prix?`<span class="draft-link-prix">${esc(l.prix)}</span>`:''}
        <button onclick="removeDraftLink(${i})">×</button>
      </div>`).join('')
    : '<div class="draft-empty">Aucun lien pour l\'instant.</div>';
}

// Accepte "example.com/x" et le complète en https://
function normalizeUrl(u) {
  let s = u.trim();
  if (!/^https?:\/\//i.test(s)) {
    if (/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(s)) s = 'https://' + s;
    else return null;
  }
  try {
    const url = new URL(s);
    if (!/^https?:$/.test(url.protocol)) return null;  // pas de javascript:
    return url.href;
  } catch(e) { return null; }
}

function saveEquip() {
  const nom = document.getElementById('ef-nom').value.trim();
  const err = document.getElementById('ef-error');
  if (!nom) { err.textContent = 'Il faut un nom.'; return; }

  // Si l'utilisateur a tapé un lien mais oublié de cliquer « + », on l'ajoute quand même
  const pendingLinkUrl = document.getElementById('ef-link-url').value.trim();
  if (pendingLinkUrl) {
    const norm = normalizeUrl(pendingLinkUrl);
    if (!norm) { err.textContent = 'Le lien saisi est invalide (doit ressembler à https://…). Corrige-le ou vide le champ.'; return; }
    const label = document.getElementById('ef-link-label').value.trim();
    const prix = document.getElementById('ef-link-prix').value.trim();
    equipDraftLinks.push({ url: norm, label: label || linkHost(norm), prix });
    ['ef-link-url','ef-link-label','ef-link-prix'].forEach(fid => { document.getElementById(fid).value = ''; });
  }

  // Photo : le champ texte peut avoir été modifié après import ; on le synchronise
  const photoRaw = document.getElementById('ef-photo').value.trim();
  let photo = '';
  if (photoRaw) {
    // une URL saisie à la main a priorité sur l'aperçu
    if (/^data:image\//i.test(photoRaw)) photo = photoRaw;
    else { const p = normalizeUrl(photoRaw); if (!p) { err.textContent = 'URL de photo invalide.'; return; } photo = p; }
  } else {
    // pas d'URL dans le champ : on garde la photo importée (dataURL) le cas échéant
    photo = equipDraftPhoto || '';
  }

  const fields = {
    nom,
    emoji: document.getElementById('ef-emoji').value.trim(),
    type: document.getElementById('ef-type').value,
    prix: +document.getElementById('ef-prix').value || 0,
    poids: +document.getElementById('ef-poids').value || 0,
    note: document.getElementById('ef-note').value.trim(),
    photo,
    // copie profonde : chaque objet a SES propres liens, jamais partagés
    liens: equipDraftLinks.map(l => ({ ...l }))
  };

  if (editingEquipId) {
    const n = findEquipById(DATA.equip, editingEquipId);
    if (n) Object.assign(n, fields);
  } else {
    const target = equipListAt(equipTargetPath);
    target.push(Object.assign({
      id: 'eq-' + Date.now() + '-' + Math.random().toString(36).slice(2,6),
      source: 'user', items: []
    }, fields));
  }

  // On nettoie l'état d'édition pour ne rien laisser fuiter vers le prochain objet
  equipDraftLinks = [];
  equipDraftPhoto = '';
  editingEquipId = null;

  closeEquipModal();
  saveLocal();
  renderView();
}

function deleteEquip(id) {
  const node = findEquipById(DATA.equip, id);
  if (!node) return;
  const n = equipCount(node);
  const msg = n ? `Supprimer « ${node.nom} » et les ${n} élément${n>1?'s':''} dedans ?`
                : `Supprimer « ${node.nom} » ?`;
  if (!confirm(msg)) return;
  const parent = findEquipParent(DATA.equip, id, null);
  const list = parent ? parent.items : DATA.equip;
  const i = list.findIndex(x => x.id === id);
  if (i > -1) list.splice(i, 1);
  // si on était zoomé dessus, on remonte
  if (equipPath.includes(id)) equipPath = equipPath.slice(0, equipPath.indexOf(id));
  saveLocal();
  renderView();
}

const MapEngine = (() => {

  const MAX_LAT = 85.0511288; // limite de Mercator

  // lng/lat -> coordonnées "monde" en pixels au zoom 0

    const x = (lng + 180) / 360 * TILE;
    const s = Math.sin(clamped * Math.PI / 180);
    const y = (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * TILE;
    return [x, y];

  function unproject(x, y) {
    const lng = x / TILE * 360 - 180;
    const n = Math.PI - 2 * Math.PI * y / TILE;
    const lat = 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
    return [lng, lat];

      this.ctx = canvas.getContext('2d');
      this.center = opts.center || [2.5, 115];  // [lat, lng]
      this.zoom = opts.zoom || 4;
      this.minZoom = opts.minZoom ?? 3;
      this.maxZoom = opts.maxZoom ?? 17;
      this.layers = { base: [], patches: [] };
      this.markers = [];

      this.onMove = opts.onMove || null;

      this._drag = null;
      this._dpr = window.devicePixelRatio || 1;

    }

    _drawScale(ctx, W, H) {
      // barre d'échelle honnête, calculée depuis la projection
      const y = H - 18, x0 = 12;
      const [lat1, lng1] = this.pxToLatLng(x0, y);
      const [lat2, lng2] = this.pxToLatLng(x0 + 100, y);
      const km = haversine(lat1, lng1, lat2, lng2);
      // arrondi à un nombre lisible
      const nice = [1,2,5,10,20,50,100,200,500,1000,2000].reduce((a,v) =>
        Math.abs(v - km) < Math.abs(a - km) ? v : a);
      const w = 100 * nice / km;
      ctx.save();
      ctx.strokeStyle = 'rgba(26,20,16,.5)'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x0, y - 4); ctx.lineTo(x0, y); ctx.lineTo(x0 + w, y); ctx.lineTo(x0 + w, y - 4);
      ctx.stroke();
      ctx.fillStyle = 'rgba(26,20,16,.65)';
      ctx.font = '10px system-ui, sans-serif';
      ctx.fillText(nice >= 1 ? nice + ' km' : (nice * 1000) + ' m', x0 + 3, y - 6);
      ctx.restore();
    }

    // ── interactions ──
    _bindEvents() {
      const cv = this.cv;
      cv.addEventListener('mousedown', e => {
        this._drag = { x: e.clientX, y: e.clientY, c: [...this.center], moved: false };
        cv.style.cursor = 'grabbing';
      });
      window.addEventListener('mousemove', e => {
        if (!this._drag) return;
        const dx = e.clientX - this._drag.x, dy = e.clientY - this._drag.y;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) this._drag.moved = true;
        const s = this.scale();
        const [cx, cy] = project(this._drag.c[1], this._drag.c[0]);
        const [lng, lat] = unproject(cx - dx / s, cy - dy / s);
        this.center = [lat, lng];
        this.draw();
      });
      window.addEventListener('mouseup', e => {
        if (!this._drag) return;
        const wasDrag = this._drag.moved;
        this._drag = null;
        cv.style.cursor = 'grab';
        // le clic ne compte que s'il a DÉMARRÉ sur le canvas et n'a pas bougé.
        // (on ne teste pas e.target : le mouseup peut atterrir sur un overlay)
        if (!wasDrag && this.onClick) {
          const r = cv.getBoundingClientRect();
          const x = e.clientX - r.left, y = e.clientY - r.top;
          if (x >= 0 && y >= 0 && x <= r.width && y <= r.height) {
            const [lat, lng] = this.pxToLatLng(x, y);
            this.onClick(lat, lng, e);
          }
        }
        this.onMove && this.onMove();
      });
      cv.addEventListener('wheel', e => {
        e.preventDefault();
        const r = cv.getBoundingClientRect();
        const mx = e.clientX - r.left, my = e.clientY - r.top;
        const [latB, lngB] = this.pxToLatLng(mx, my);
        const dz = -e.deltaY * 0.0025;
        const z = Math.max(this.minZoom, Math.min(this.maxZoom, this.zoom + dz));
        if (z === this.zoom) return;
        this.zoom = z;
        // garde le point sous le curseur fixe
        const [latA, lngA] = this.pxToLatLng(mx, my);
        this.center = [this.center[0] + (latB - latA), this.center[1] + (lngB - lngA)];
        this.draw();
        clearTimeout(this._mt); this._mt = setTimeout(() => this.onMove && this.onMove(), 150);
      }, { passive: false });

      // tactile : pan + pinch
      let pinch = null;
      cv.addEventListener('touchstart', e => {
        if (e.touches.length === 1) {
          const t = e.touches[0];
          this._drag = { x: t.clientX, y: t.clientY, c: [...this.center], moved: false };
        } else if (e.touches.length === 2) {
          this._drag = null;
          pinch = { d: touchDist(e.touches), z: this.zoom };
        }
      }, { passive: true });
      cv.addEventListener('touchmove', e => {
        if (e.touches.length === 1 && this._drag) {
          e.preventDefault();
          const t = e.touches[0];
          const dx = t.clientX - this._drag.x, dy = t.clientY - this._drag.y;
          const s = this.scale();
          const [cx, cy] = project(this._drag.c[1], this._drag.c[0]);
          const [lng, lat] = unproject(cx - dx / s, cy - dy / s);
          this.center = [lat, lng]; this.draw();
        } else if (e.touches.length === 2 && pinch) {
          e.preventDefault();
          const d = touchDist(e.touches);
          this.zoom = Math.max(this.minZoom, Math.min(this.maxZoom, pinch.z + Math.log2(d / pinch.d)));
          this.draw();
        }
      }, { passive: false });
      cv.addEventListener('touchend', e => {
        if (e.touches.length === 0) { this._drag = null; pinch = null; this.onMove && this.onMove(); }
      });
      cv.style.cursor = 'grab';
    }

    zoomBy(d) {
      this.zoom = Math.max(this.minZoom, Math.min(this.maxZoom, this.zoom + d));
      this.draw(); this.onMove && this.onMove();
    }
  }

  function touchDist(t) {
    return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  }
  function haversine(lat1, lng1, lat2, lng2) {
    const R = 6371, r = Math.PI / 180;
    const dLat = (lat2 - lat1) * r, dLng = (lng2 - lng1) * r;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*r) * Math.cos(lat2*r) * Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  return { Map, project, unproject, haversine };
})();

let MAP = null;
let openPopupId = null;

// Zones tracées à la main. Le fond Natural Earth s'efface dessous
// dès que minZoom est atteint. Ajoute les tiennes ici (ou via l'outil).
const PATCHES = [];

function allPatches() {
  return PATCHES.concat(DATA.patches || []);
}


function tracePanelHtml() {

  return `
  <div class="trace-panel">

      </label>

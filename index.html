<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aventure Asie</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1410;
    --paper: #f7f3ed;
    --paper2: #ede8e0;
    --paper3: #e3ddd4;
    --gold: #c9922a;
    --gold-light: #f0d9a8;
    --ocean: #1a5c8a;
    --jungle: #2d6a3f;
    --sand: #c4a267;
    --danger: #c0392b;
    --warn: #e67e22;
    --ok: #27ae60;
    --MY: #854F0B; --MY-bg: #fdf3e3;
    --PH: #1a5c8a; --PH-bg: #e8f4fd;
    --ID: #2d6a3f; --ID-bg: #e8f7ed;
    --SG: #555; --SG-bg: #f0eeea;
    --radius: 12px;
    --shadow: 0 2px 12px rgba(26,20,16,.10);
    --shadow-lg: 0 8px 32px rgba(26,20,16,.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── SIDEBAR ── */
  #sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 260px; background: var(--ink);
    display: flex; flex-direction: column;
    z-index: 100; overflow-y: auto;
    transition: transform .3s ease;
  }
  #sidebar-logo {
    padding: 28px 24px 20px;
    border-bottom: 1px solid rgba(255,255,255,.1);
  }
  #sidebar-logo h1 {
    font-family: 'Playfair Display', serif;
    font-size: 20px; color: var(--gold-light);
    line-height: 1.2;
  }
  #sidebar-logo p { font-size: 11px; color: rgba(255,255,255,.4); margin-top: 4px; letter-spacing: .05em; text-transform: uppercase; }

  .season-toggle-wrap {
    padding: 16px 20px;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .season-toggle-label { font-size: 10px; color: rgba(255,255,255,.4); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
  .season-btn {
    display: block; width: 100%; text-align: left;
    padding: 8px 12px; border-radius: 8px;
    border: 1px solid transparent;
    background: transparent; color: rgba(255,255,255,.5);
    font-family: 'DM Sans', sans-serif; font-size: 12px;
    cursor: pointer; margin-bottom: 4px; transition: all .2s;
  }
  .season-btn:hover { background: rgba(255,255,255,.07); color: rgba(255,255,255,.8); }
  .season-btn.active {
    border-color: var(--active-color, var(--gold));
    background: rgba(255,255,255,.06);
    color: #fff; font-weight: 500;
  }
  .season-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; background: var(--active-color, #888); }

  #sidebar-nav { flex: 1; padding: 12px 0; }
  .nav-section-label { padding: 12px 24px 4px; font-size: 10px; color: rgba(255,255,255,.3); text-transform: uppercase; letter-spacing: .1em; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 20px; cursor: pointer;
    color: rgba(255,255,255,.55); font-size: 13px;
    border-left: 3px solid transparent;
    transition: all .15s;
  }
  .nav-item:hover { color: #fff; background: rgba(255,255,255,.05); }
  .nav-item.active { color: #fff; border-left-color: var(--gold); background: rgba(255,255,255,.07); }
  .nav-item .nav-emoji { font-size: 15px; width: 20px; text-align: center; }
  .nav-item .nav-days { margin-left: auto; font-size: 11px; color: rgba(255,255,255,.3); }
  .nav-country-tag {
    font-size: 9px; padding: 1px 5px; border-radius: 3px;
    font-weight: 500; letter-spacing: .03em;
  }

  #sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid rgba(255,255,255,.08);
  }
  .sidebar-action-btn {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 9px 12px; border-radius: 8px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    color: rgba(255,255,255,.7); font-family: 'DM Sans', sans-serif;
    font-size: 12px; cursor: pointer; margin-bottom: 6px;
    transition: all .2s;
  }
  .sidebar-action-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
  .sidebar-action-btn svg { flex-shrink: 0; }

  /* ── MAIN ── */
  #main {
    margin-left: 260px;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }

  /* ── TOPBAR ── */
  #topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(247,243,237,.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--paper3);
    padding: 14px 32px;
    display: flex; align-items: center; gap: 16px;
  }
  #topbar-title { font-family: 'Playfair Display', serif; font-size: 22px; flex: 1; }
  #topbar-title span { color: var(--gold); font-style: italic; }
  .topbar-season-badge {
    padding: 6px 14px; border-radius: 20px;
    font-size: 12px; font-weight: 500;
    border: 1.5px solid currentColor;
  }
  #topbar-views { display: flex; gap: 4px; }
  .view-btn {
    padding: 6px 14px; border-radius: 8px;
    border: 1px solid var(--paper3); background: transparent;
    font-family: 'DM Sans', sans-serif; font-size: 12px;
    cursor: pointer; color: #888; transition: all .15s;
  }
  .view-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* ── CONTENT ── */
  #content { flex: 1; padding: 32px; }

  /* ── OVERVIEW CARDS ── */
  .stats-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: #fff; border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow);
    border: 1px solid var(--paper3);
  }
  .stat-card-label { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: .07em; }
  .stat-card-value { font-family: 'Playfair Display', serif; font-size: 32px; color: var(--ink); margin: 4px 0 2px; }
  .stat-card-sub { font-size: 12px; color: #bbb; }
  .stat-card-bar { height: 4px; background: var(--paper3); border-radius: 2px; margin-top: 12px; overflow: hidden; }
  .stat-card-bar-fill { height: 100%; border-radius: 2px; background: var(--gold); transition: width .6s ease; }

  /* ── SEASON ALERT ── */
  .season-alert {
    padding: 14px 20px; border-radius: var(--radius);
    margin-bottom: 24px; font-size: 13px;
    display: flex; align-items: flex-start; gap: 12px;
    border: 1px solid;
  }
  .season-alert.good { background: #f0fdf4; border-color: #86efac; color: #166534; }
  .season-alert.warn { background: #fffbeb; border-color: #fcd34d; color: #92400e; }
  .season-alert.bad { background: #fef2f2; border-color: #fca5a5; color: #991b1b; }

  /* ── TIMELINE VIEW ── */
  .timeline { position: relative; }
  .timeline::before {
    content: ''; position: absolute; left: 32px; top: 0; bottom: 0;
    width: 2px; background: var(--paper3);
  }

  .timeline-item {
    display: flex; gap: 24px; margin-bottom: 20px;
    animation: fadeIn .3s ease both;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

  .timeline-dot {
    width: 66px; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center;
    padding-top: 20px; position: relative; z-index: 1;
  }
  .timeline-dot-circle {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; border: 3px solid var(--paper);
    box-shadow: 0 0 0 2px var(--paper3);
  }
  .timeline-dot-line {
    width: 2px; flex: 1; min-height: 20px; background: var(--paper3); margin-top: 6px;
  }

  .timeline-card {
    flex: 1; background: #fff; border-radius: var(--radius);
    box-shadow: var(--shadow); border: 1px solid var(--paper3);
    overflow: hidden; cursor: pointer; transition: box-shadow .2s, transform .2s;
  }
  .timeline-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
  .timeline-card.expanded { box-shadow: var(--shadow-lg); }

  .card-header {
    padding: 16px 20px;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .card-country-tag {
    font-size: 10px; font-weight: 600; padding: 3px 8px;
    border-radius: 4px; letter-spacing: .05em;
    text-transform: uppercase; flex-shrink: 0; margin-top: 2px;
  }
  .card-title-wrap { flex: 1; }
  .card-title { font-family: 'Playfair Display', serif; font-size: 18px; }
  .card-meta { font-size: 12px; color: #999; margin-top: 2px; }
  .card-days-badge {
    background: var(--paper2); border-radius: 8px;
    padding: 4px 10px; font-size: 12px; color: #777;
    flex-shrink: 0;
  }

  .card-season-row {
    padding: 8px 20px 12px;
    display: flex; align-items: center; gap: 8px;
    border-top: 1px solid var(--paper2);
    font-size: 12px;
  }
  .card-season-badge {
    padding: 3px 10px; border-radius: 12px;
    font-size: 11px; font-weight: 500;
  }
  .ok-badge { background: #dcfce7; color: #166534; }
  .warn-badge { background: #fef9c3; color: #854d0e; }
  .bad-badge { background: #fee2e2; color: #991b1b; }

  .card-body-wrap { padding: 0 20px 16px; }
  .card-description { font-size: 13px; color: #555; line-height: 1.6; margin-bottom: 12px; }

  .card-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .pill {
    font-size: 11px; padding: 4px 10px; border-radius: 20px;
    background: var(--paper2); color: #666;
  }
  .pill.highlight { background: var(--gold-light); color: #7a5010; font-weight: 500; }

  .card-images { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .card-image-thumb {
    width: 80px; height: 60px; border-radius: 8px;
    object-fit: cover; cursor: pointer;
    border: 2px solid transparent; transition: border-color .2s;
  }
  .card-image-thumb:hover { border-color: var(--gold); }
  .add-image-btn {
    width: 80px; height: 60px; border-radius: 8px;
    border: 2px dashed var(--paper3); background: var(--paper);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; cursor: pointer; color: #bbb;
    font-size: 10px; gap: 3px; transition: all .2s;
  }
  .add-image-btn:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-light); }

  .card-notes-wrap { margin-top: 8px; }
  .card-notes {
    width: 100%; min-height: 60px; padding: 10px 12px;
    border: 1px solid var(--paper3); border-radius: 8px;
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    color: var(--ink); background: var(--paper);
    resize: vertical; outline: none;
    transition: border-color .2s;
  }
  .card-notes:focus { border-color: var(--gold); }
  .card-notes::placeholder { color: #ccc; }

  .card-budget-row {
    display: flex; justify-content: space-between;
    padding: 8px 12px; background: var(--paper);
    border-radius: 8px; font-size: 12px; color: #777;
    margin-top: 8px;
  }
  .card-budget-row strong { color: var(--ink); }

  .card-actions {
    display: flex; gap: 8px; margin-top: 12px;
    padding-top: 12px; border-top: 1px solid var(--paper2);
  }
  .card-action-btn {
    padding: 7px 14px; border-radius: 8px;
    border: 1px solid var(--paper3); background: transparent;
    font-family: 'DM Sans', sans-serif; font-size: 12px;
    cursor: pointer; color: #666; transition: all .15s;
    display: flex; align-items: center; gap: 6px;
  }
  .card-action-btn:hover { background: var(--paper2); color: var(--ink); }
  .card-action-btn.danger:hover { background: #fee2e2; color: var(--danger); border-color: #fca5a5; }
  .card-action-btn.primary {
    background: var(--ink); color: #fff; border-color: var(--ink);
  }
  .card-action-btn.primary:hover { background: #333; }

  /* ── GRID VIEW ── */
  .grid-view {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .grid-card {
    background: #fff; border-radius: var(--radius);
    box-shadow: var(--shadow); border: 1px solid var(--paper3);
    overflow: hidden; cursor: pointer; transition: all .2s;
  }
  .grid-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-3px); }
  .grid-card-hero {
    height: 140px; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 52px;
  }
  .grid-card-body { padding: 16px; }
  .grid-card-title { font-family: 'Playfair Display', serif; font-size: 16px; margin-bottom: 4px; }
  .grid-card-meta { font-size: 12px; color: #999; margin-bottom: 10px; }
  .grid-card-season { font-size: 12px; }

  /* ── BUDGET VIEW ── */
  .budget-view { max-width: 800px; }
  .budget-section-title {
    font-family: 'Playfair Display', serif; font-size: 20px;
    margin-bottom: 16px; padding-bottom: 8px;
    border-bottom: 2px solid var(--paper3);
  }
  .budget-line {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; background: #fff;
    border-radius: 10px; margin-bottom: 8px;
    border: 1px solid var(--paper3); box-shadow: var(--shadow);
  }
  .budget-line-emoji { font-size: 20px; flex-shrink: 0; }
  .budget-line-label { flex: 1; font-size: 13px; }
  .budget-line-sub { font-size: 11px; color: #999; }
  .budget-line-amount { font-family: 'Playfair Display', serif; font-size: 20px; }
  .budget-line-edit {
    font-size: 12px; padding: 4px 8px; border-radius: 6px;
    border: 1px solid var(--paper3); background: var(--paper);
    font-family: 'DM Sans', sans-serif; width: 80px; text-align: right;
    color: var(--ink); outline: none;
  }
  .budget-line-edit:focus { border-color: var(--gold); }
  .budget-total-card {
    background: var(--ink); color: #fff; border-radius: var(--radius);
    padding: 24px 28px; margin-top: 20px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .budget-total-label { font-size: 14px; color: rgba(255,255,255,.6); }
  .budget-total-value { font-family: 'Playfair Display', serif; font-size: 36px; color: var(--gold-light); }
  .budget-remaining { font-size: 13px; color: rgba(255,255,255,.5); margin-top: 4px; }

  /* ── MODALS ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(26,20,16,.6);
    backdrop-filter: blur(4px); z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--paper); border-radius: 16px;
    padding: 32px; width: 560px; max-width: 95vw;
    max-height: 90vh; overflow-y: auto;
    box-shadow: var(--shadow-lg);
    transform: scale(.95) translateY(12px);
    transition: transform .2s;
  }
  .modal-overlay.open .modal { transform: none; }
  .modal-title {
    font-family: 'Playfair Display', serif; font-size: 24px;
    margin-bottom: 24px;
  }
  .form-row { margin-bottom: 16px; }
  .form-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; display: block; }
  .form-input, .form-select, .form-textarea {
    width: 100%; padding: 10px 14px; border-radius: 8px;
    border: 1.5px solid var(--paper3); background: #fff;
    font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink);
    outline: none; transition: border-color .2s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
  .form-textarea { min-height: 80px; resize: vertical; }
  .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
  .btn-cancel {
    padding: 10px 20px; border-radius: 8px;
    border: 1px solid var(--paper3); background: transparent;
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    cursor: pointer; color: #777; transition: all .15s;
  }
  .btn-cancel:hover { background: var(--paper2); }
  .btn-save {
    padding: 10px 24px; border-radius: 8px;
    border: none; background: var(--ink); color: #fff;
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    cursor: pointer; transition: background .15s;
  }
  .btn-save:hover { background: #333; }

  /* ── LIGHTBOX ── */
  #lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.9);
    z-index: 2000; display: flex; align-items: center;
    justify-content: center; opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  #lightbox.open { opacity: 1; pointer-events: all; }
  #lightbox img { max-width: 90vw; max-height: 85vh; border-radius: 8px; object-fit: contain; }
  #lightbox-close {
    position: absolute; top: 20px; right: 24px;
    color: rgba(255,255,255,.7); font-size: 32px; cursor: pointer;
    line-height: 1; background: none; border: none;
  }

  /* ── GITHUB SYNC STATUS ── */
  #sync-status {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--ink); color: #fff;
    padding: 10px 16px; border-radius: 10px;
    font-size: 12px; display: flex; align-items: center; gap: 8px;
    box-shadow: var(--shadow-lg); z-index: 500;
    opacity: 0; transform: translateY(8px);
    transition: all .3s;
  }
  #sync-status.show { opacity: 1; transform: none; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .sync-dot.saving { background: var(--warn); animation: pulse .8s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* ── ADD ETAPE button ── */
  .add-etape-timeline {
    display: flex; gap: 24px; margin-bottom: 20px; align-items: center;
  }
  .add-etape-btn-timeline {
    flex: 1; padding: 16px; border: 2px dashed var(--paper3);
    border-radius: var(--radius); background: transparent;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    font-size: 13px; color: #bbb; transition: all .2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .add-etape-btn-timeline:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-light); }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--paper3); border-radius: 3px; }
</style>
</head>
<body>

<!-- SIDEBAR -->
<nav id="sidebar">
  <div id="sidebar-logo">
    <h1>Aventure<br><em>Asie</em></h1>
    <p id="sidebar-subtitle">40 jours · 4 pays</p>
  </div>

  <div class="season-toggle-wrap">
    <div class="season-toggle-label">Période de voyage</div>
    <button class="season-btn" data-season="nov-avril" style="--active-color:#22c55e" onclick="setSeason('nov-avril')">
      <span class="season-dot" style="background:#22c55e"></span>Nov → Avril ✓
    </button>
    <button class="season-btn" data-season="juil-aout" style="--active-color:#f59e0b" onclick="setSeason('juil-aout')">
      <span class="season-dot" style="background:#f59e0b"></span>Juil → Août ⚠
    </button>
    <button class="season-btn" data-season="sept-oct" style="--active-color:#f97316" onclick="setSeason('sept-oct')">
      <span class="season-dot" style="background:#f97316"></span>Sept → Oct ⚠
    </button>
  </div>

  <div id="sidebar-nav"></div>

  <div id="sidebar-footer">
    <button class="sidebar-action-btn" onclick="openAddModal()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      Ajouter une étape
    </button>
    <button class="sidebar-action-btn" onclick="syncGithub()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
      Sync GitHub
    </button>
    <button class="sidebar-action-btn" onclick="resetToken()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Changer token GitHub
    </button>
    <button class="sidebar-action-btn" onclick="exportData()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Exporter JSON
    </button>
  </div>
</nav>

<!-- MAIN -->

function setupToken() {
  const existing = localStorage.getItem('gh_token');
  if (!existing) {
    const t = prompt('Entre ton GitHub Personal Access Token (repo scope) :');
    if (t) localStorage.setItem('gh_token', t.trim());
    return t;
  }
  return existing;
}

function resetToken() {
  localStorage.removeItem('gh_token');

  try {

      headers: { Authorization: `token ${getToken()}`, Accept: 'application/vnd.github.v3+json' }
    });
    if (r.ok) {
      const j = await r.json();
      return JSON.parse(atob(j.content.replace(/\n/g,'')));
    }

  // fallback: embedded data
  return getDefaultData();
}

// ── SEASON ──
function setSeason(s) {
  currentSeason = s;
  DATA.meta.saison_active = s;
  document.querySelectorAll('.season-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.season === s);
  });
  render();
  saveLocal();
}

// ── VIEW ──
function setView(v) {
  currentView = v;
  document.querySelectorAll('.view-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.toLowerCase().includes(v) ||
      (v==='timeline'&&b.textContent==='Timeline') ||
      (v==='grid'&&b.textContent==='Grille') ||
      (v==='budget'&&b.textContent==='Budget'));
  });
  renderView();
}

// ── RENDER ──
function render() {
  renderSidebar();
  renderStats();
  renderSeasonAlert();
  renderView();
  updateTopbarSeason();
}

function updateTopbarSeason() {
  const m = SEASON_META[currentSeason];
  const badge = document.getElementById('topbar-season-badge');
  badge.textContent = m.label;
  badge.style.color = m.color;
  badge.style.borderColor = m.color;
}

function renderSidebar() {
  const nav = document.getElementById('sidebar-nav');
  const sorted = [...DATA.etapes].sort((a,b) => a.ordre - b.ordre);
  let byCountry = {};
  sorted.forEach(e => { if(!byCountry[e.pays]) byCountry[e.pays] = []; byCountry[e.pays].push(e); });

  let html = '';
  Object.entries(byCountry).forEach(([pays, etapes]) => {
    const code = COUNTRY_CODES[pays] || '??';
    const col = COUNTRY_COLORS[code] || '#888';
    html += `<div class="nav-section-label">${pays}</div>`;
    etapes.forEach(e => {
      const active = expandedCards.has(e.id) ? 'active' : '';
      html += `<div class="nav-item ${active}" onclick="scrollToCard('${e.id}')">
        <span class="nav-emoji">${e.emoji}</span>
        <span>${e.ville}</span>
        <span class="nav-days">${e.duree}j</span>
      </div>`;
    });
  });
  nav.innerHTML = html;

  document.getElementById('sidebar-subtitle').textContent =
    `${DATA.meta.duree} jours · ${Object.keys(byCountry).length} pays`;
}

function renderStats() {
  const sorted = [...DATA.etapes].sort((a,b) => a.ordre - b.ordre);
  const totalDays = sorted.reduce((s,e) => s+e.duree, 0);
  const totalBudgetLife = sorted.reduce((s,e) => s + (e.cout_fixe || e.budget_jour * e.duree), 0);
  const totalVols = DATA.budget.vols_internes || 340;
  const totalActivites = DATA.budget.activites_phares || 415;
  const totalSpend = (DATA.budget.vol_ar||550) + totalVols + totalActivites + totalBudgetLife + (DATA.budget.assurance||100) + (DATA.budget.vaccins||200) + (DATA.budget.visas||60);
  const reste = DATA.meta.budget_total - totalSpend;
  const pct = Math.round((totalSpend / DATA.meta.budget_total) * 100);

  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card">
      <div class="stat-card-label">Durée totale</div>
      <div class="stat-card-value">${totalDays}</div>
      <div class="stat-card-sub">jours de voyage</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">Budget total</div>
      <div class="stat-card-value">${DATA.meta.budget_total.toLocaleString()}<span style="font-size:16px;color:#bbb"> €</span></div>
      <div class="stat-card-sub">enveloppe prévue</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">Dépenses estimées</div>
      <div class="stat-card-value">${totalSpend.toLocaleString()}<span style="font-size:16px;color:#bbb"> €</span></div>
      <div class="stat-card-sub">tous postes inclus</div>
      <div class="stat-card-bar"><div class="stat-card-bar-fill" style="width:${Math.min(pct,100)}%;background:${pct>90?'#e74c3c':pct>75?'#f39c12':'#c9922a'}"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">Marge restante</div>
      <div class="stat-card-value" style="color:${reste>500?'#27ae60':reste>0?'#f39c12':'#e74c3c'}">${reste.toLocaleString()}<span style="font-size:16px"> €</span></div>
      <div class="stat-card-sub">imprévus & plaisirs</div>
    </div>
  `;
}

function renderSeasonAlert() {
  const m = SEASON_META[currentSeason];
  document.getElementById('season-alert-box').innerHTML = `
    <div class="season-alert ${m.cls}">
      <span style="font-size:20px">${m.cls==='good'?'✅':m.cls==='warn'?'⚠️':'🚫'}</span>
      <div>
        <strong>${m.label}</strong><br>
        <span>${m.note}</span>
      </div>
    </div>
  `;
}

function renderView() {
  const container = document.getElementById('view-container');
  if (currentView === 'timeline') container.innerHTML = buildTimeline();
  else if (currentView === 'grid') container.innerHTML = buildGrid();
  else if (currentView === 'budget') container.innerHTML = buildBudget();
  bindImageUploads();
  bindNotesSave();
}

// ── TIMELINE ──
function buildTimeline() {
  const sorted = [...DATA.etapes].sort((a,b) => a.ordre - b.ordre);
  let html = '<div class="timeline">';
  sorted.forEach((e, i) => {
    const code = e.pays_code || COUNTRY_CODES[e.pays] || '??';
    const color = e.couleur || COUNTRY_COLORS[code] || '#888';
    const bg = e.bg || COUNTRY_BG[code] || '#f5f5f5';
    const s = e.saisons?.[currentSeason] || {};
    const isLast = i === sorted.length - 1;
    const expanded = expandedCards.has(e.id);
    const conseil = s.conseil || '';
    const badgeCls = conseil.includes('⭐') ? 'ok-badge' : conseil.includes('⚠') || conseil.includes('🚫') ? 'bad-badge' : 'warn-badge';

    html += `
    <div class="timeline-item" id="card-${e.id}" style="animation-delay:${i*0.04}s">
      <div class="timeline-dot">
        <div class="timeline-dot-circle" style="background:${bg}; border-color:${color}20">
          ${e.emoji}
        </div>
        ${!isLast ? '<div class="timeline-dot-line"></div>' : ''}
      </div>
      <div class="timeline-card ${expanded?'expanded':''}" onclick="toggleCard('${e.id}', event)">
        <div class="card-header">
          <span class="card-country-tag" style="background:${bg};color:${color}">${code}</span>
          <div class="card-title-wrap">
            <div class="card-title">${e.ville}</div>
            <div class="card-meta">${e.transport_arrivee||''}</div>
          </div>
          <span class="card-days-badge">${e.duree} jour${e.duree>1?'s':''}</span>
        </div>
        <div class="card-season-row">
          <span>${s.meteo || ''}</span>
          <span class="card-season-badge ${badgeCls}">${conseil}</span>
        </div>
        ${expanded ? `
        <div class="card-body-wrap">
          <p class="card-description">${e.description}</p>
          ${e.highlight ? `<div style="margin-bottom:10px"><span class="pill highlight">${e.highlight}</span> <span style="font-size:12px;color:#999">${e.cout_activite||''}</span></div>` : ''}
          <div class="card-pills">
            ${(e.activites||[]).map(a => `<span class="pill">${a}</span>`).join('')}
          </div>
          ${(e.images||[]).length > 0 || true ? `
          <div class="card-images" id="imgs-${e.id}">
            ${(e.images||[]).map((img,idx) => `
              <img class="card-image-thumb" src="${img}" alt="Photo ${idx+1}"
                onclick="openLightbox('${img}', event)">
            `).join('')}
            <label class="add-image-btn" title="Ajouter une photo">
              <input type="file" accept="image/*" style="display:none"
                data-etape="${e.id}" class="image-upload-input" multiple>
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              <span>Photo</span>
            </label>
          </div>` : ''}
          <div class="card-notes-wrap">
            <textarea class="card-notes" data-etape="${e.id}"
              placeholder="Notes personnelles, conseils, contacts...">${e.notes||''}</textarea>
          </div>
          <div class="card-budget-row">
            <span>🏨 ${e.logement||'—'}</span>
            <strong>${e.cout_fixe ? e.cout_fixe+'€ forfait' : (e.budget_jour||0)+'€/jour · '+(e.budget_jour*e.duree)+'€ total'}</strong>
          </div>
          <div class="card-actions">
            <button class="card-action-btn primary" onclick="editEtape('${e.id}', event)">
              ✏️ Modifier
            </button>
            <button class="card-action-btn" onclick="moveEtape('${e.id}', -1, event)">↑ Avant</button>
            <button class="card-action-btn" onclick="moveEtape('${e.id}', 1, event)">↓ Après</button>
            <button class="card-action-btn danger" onclick="deleteEtape('${e.id}', event)">
              🗑 Supprimer
            </button>
          </div>
        </div>` : ''}
      </div>
    </div>`;
  });
  html += `
  <div class="add-etape-timeline">
    <div style="width:66px;flex-shrink:0"></div>
    <button class="add-etape-btn-timeline" onclick="openAddModal()">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      Ajouter une étape
    </button>
  </div>`;
  html += '</div>';
  return html;
}

// ── GRID ──
function buildGrid() {
  const sorted = [...DATA.etapes].sort((a,b) => a.ordre - b.ordre);
  let html = '<div class="grid-view">';
  sorted.forEach(e => {
    const code = e.pays_code || COUNTRY_CODES[e.pays] || '??';
    const color = e.couleur || COUNTRY_COLORS[code] || '#888';
    const bg = e.bg || COUNTRY_BG[code] || '#f5f5f5';
    const s = e.saisons?.[currentSeason] || {};
    const conseil = s.conseil || '';
    const badgeCls = conseil.includes('⭐') ? 'ok-badge' : conseil.includes('⚠') || conseil.includes('🚫') ? 'bad-badge' : 'warn-badge';
    html += `
    <div class="grid-card" onclick="setView('timeline');setTimeout(()=>scrollToCard('${e.id}'),100)">
      <div class="grid-card-hero" style="background:${bg}">
        ${e.images&&e.images[0] ? `<img src="${e.images[0]}" style="width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0" alt="">` : ''}
        <span style="position:relative;z-index:1;font-size:52px">${e.emoji}</span>
        <span class="card-country-tag" style="position:absolute;top:10px;left:10px;background:${color};color:#fff;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:600;letter-spacing:.05em">${code} · ${e.duree}j</span>
        ${e.highlight?`<span style="position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;padding:3px 8px;border-radius:10px">${e.highlight}</span>`:''}
      </div>
      <div class="grid-card-body">
        <div class="grid-card-title">${e.ville}</div>
        <div class="grid-card-meta">${e.duree} jour${e.duree>1?'s':''} · ${e.pays}</div>
        <div class="grid-card-season">
          <span class="card-season-badge ${badgeCls}">${s.meteo||'—'}</span>
          <span style="font-size:11px;color:#aaa;margin-left:6px">${conseil}</span>
        </div>
      </div>
    </div>`;
  });
  html += `<div class="grid-card" style="border:2px dashed var(--paper3);background:transparent;box-shadow:none;cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:200px" onclick="openAddModal()">
    <div style="text-align:center;color:#ccc">
      <div style="font-size:36px;margin-bottom:8px">+</div>
      <div style="font-size:13px">Nouvelle étape</div>
    </div>
  </div>`;
  html += '</div>';
  return html;
}

// ── BUDGET ──
function buildBudget() {
  const sorted = [...DATA.etapes].sort((a,b) => a.ordre - b.ordre);
  const b = DATA.budget;

  // Fixed costs
  const fixed = [
    { emoji:'✈️', label:'Vol Bruxelles → KL (A/R)', sub:'Point d\'entrée', key:'vol_ar', val:b.vol_ar||550 },
    { emoji:'🛫', label:'Vols internes', sub:'Entre les îles et pays', key:'vols_internes', val:b.vols_internes||340 },
    { emoji:'⭐', label:'Activités phares', sub:'Croisière, mantas, requins baleines...', key:'activites_phares', val:b.activites_phares||415 },
    { emoji:'🏥', label:'Assurance voyage', sub:'Rapatriement médical inclus', key:'assurance', val:b.assurance||100 },
    { emoji:'💉', label:'Vaccins', sub:'Hépatite A, typhoïde, rage...', key:'vaccins', val:b.vaccins||200 },
    { emoji:'📋', label:'Visas', sub:'Vietnam + Cambodge si applicable', key:'visas', val:b.visas||60 },
    { emoji:'🎲', label:'Imprévus', sub:'Marge de sécurité', key:'imprevu', val:b.imprevu||300 },
  ];

  let lifeTotal = 0;
  const lifeLines = sorted.map(e => {
    const cout = e.cout_fixe || (e.budget_jour * e.duree);
    lifeTotal += cout;
    return { e, cout };
  });

  const fixedTotal = fixed.reduce((s,f) => s+f.val, 0);
  const grand = fixedTotal + lifeTotal;
  const reste = DATA.meta.budget_total - grand;

  let html = '<div class="budget-view">';

  html += '<div class="budget-section-title">Coûts fixes</div>';
  fixed.forEach(f => {
    html += `<div class="budget-line">
      <span class="budget-line-emoji">${f.emoji}</span>
      <div style="flex:1">
        <div class="budget-line-label" style="font-weight:500">${f.label}</div>
        <div class="budget-line-sub">${f.sub}</div>
      </div>
      <input class="budget-line-edit" type="number" value="${f.val}"
        onchange="updateBudgetKey('${f.key}', this.value)" onclick="event.stopPropagation()">
      <span class="budget-line-amount" style="margin-left:8px;min-width:60px;text-align:right">${f.val.toLocaleString()} €</span>
    </div>`;
  });

  html += '<div class="budget-section-title" style="margin-top:28px">Vie courante par étape</div>';
  lifeLines.forEach(({e,cout}) => {
    const code = e.pays_code || COUNTRY_CODES[e.pays] || '??';
    const color = e.couleur || COUNTRY_COLORS[code] || '#888';
    html += `<div class="budget-line">
      <span class="budget-line-emoji">${e.emoji}</span>
      <div style="flex:1">
        <div class="budget-line-label" style="font-weight:500">${e.ville}</div>
        <div class="budget-line-sub">${e.cout_fixe?'Forfait inclus':e.budget_jour+'€/jour × '+e.duree+' jours'}</div>
      </div>
      ${!e.cout_fixe?`<input class="budget-line-edit" type="number" value="${e.budget_jour}"
        onchange="updateEtapeBudget('${e.id}', this.value)" onclick="event.stopPropagation()">`:
        '<span style="width:80px;text-align:right;font-size:12px;color:#bbb">forfait</span>'}
      <span class="budget-line-amount" style="margin-left:8px;min-width:60px;text-align:right;color:${color}">${cout.toLocaleString()} €</span>
    </div>`;
  });

  html += `
  <div class="budget-total-card">
    <div>
      <div class="budget-total-label">Total estimé</div>
      <div class="budget-total-value">${grand.toLocaleString()} €</div>
      <div class="budget-remaining">sur ${DATA.meta.budget_total.toLocaleString()} € · marge : <strong style="color:${reste>0?'#6ee7b7':'#fca5a5'}">${reste.toLocaleString()} €</strong></div>
    </div>
    <div style="text-align:right">
      <div class="budget-total-label">Budget/jour moyen</div>
      <div style="font-family:'Playfair Display',serif;font-size:28px;color:var(--gold-light)">${Math.round(grand/DATA.meta.duree)} €</div>
    </div>
  </div>`;

  html += '</div>';
  return html;
}

// ── INTERACTIONS ──
function toggleCard(id, event) {
  if (event && event.target.closest('.card-action-btn, .card-notes, .image-upload-input, .card-image-thumb, .add-image-btn')) return;
  if (expandedCards.has(id)) expandedCards.delete(id);
  else expandedCards.add(id);
  renderView();
  renderSidebar();
}

function scrollToCard(id) {
  expandedCards.add(id);
  renderView();
  renderSidebar();
  setTimeout(() => {
    const el = document.getElementById('card-'+id);
    if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
  }, 80);
}

function bindImageUploads() {
  document.querySelectorAll('.image-upload-input').forEach(input => {
    input.addEventListener('change', async function() {
      const id = this.dataset.etape;
      const files = Array.from(this.files);
      for (const file of files) {
        const dataUrl = await readFileAsDataUrl(file);
        const etape = DATA.etapes.find(e => e.id === id);
        if (etape) {
          if (!etape.images) etape.images = [];
          etape.images.push(dataUrl);
        }
      }
      saveLocal();
      renderView();
    });
  });
}

function bindNotesSave() {
  document.querySelectorAll('.card-notes').forEach(ta => {
    ta.addEventListener('input', function() {
      const id = this.dataset.etape;
      const etape = DATA.etapes.find(e => e.id === id);
      if (etape) etape.notes = this.value;
      saveLocal();
    });
  });
}

function readFileAsDataUrl(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.readAsDataURL(file);
  });
}

function openLightbox(src, event) {
  event && event.stopPropagation();
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }

// ── ADD / EDIT ──
function openAddModal() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Nouvelle étape';
  document.getElementById('f-emoji').value = '🌍';
  document.getElementById('f-pays').value = 'Philippines';
  document.getElementById('f-ville').value = '';
  document.getElementById('f-duree').value = '3';
  document.getElementById('f-budget').value = '35';
  document.getElementById('f-description').value = '';
  document.getElementById('f-activites').value = '';
  document.getElementById('f-s1').value = '';
  document.getElementById('f-s2').value = '';
  document.getElementById('f-s3').value = '';
  document.getElementById('modal-overlay').classList.add('open');
}

function editEtape(id, event) {
  event && event.stopPropagation();
  const e = DATA.etapes.find(x => x.id === id);
  if (!e) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'Modifier l\'étape';
  document.getElementById('f-emoji').value = e.emoji || '🌍';
  document.getElementById('f-pays').value = e.pays || 'Philippines';
  document.getElementById('f-ville').value = e.ville || '';
  document.getElementById('f-duree').value = e.duree || 3;
  document.getElementById('f-budget').value = e.budget_jour || 35;
  document.getElementById('f-description').value = e.description || '';
  document.getElementById('f-activites').value = (e.activites||[]).join(', ');
  document.getElementById('f-s1').value = e.saisons?.['nov-avril']?.meteo || '';
  document.getElementById('f-s2').value = e.saisons?.['juil-aout']?.meteo || '';
  document.getElementById('f-s3').value = e.saisons?.['sept-oct']?.meteo || '';
  document.getElementById('modal-overlay').classList.add('open');
}

function saveEtape() {
  const pays = document.getElementById('f-pays').value;
  const code = COUNTRY_CODES[pays] || '??';
  const s1 = document.getElementById('f-s1').value;
  const s2 = document.getElementById('f-s2').value;
  const s3 = document.getElementById('f-s3').value;

  if (editingId) {
    const e = DATA.etapes.find(x => x.id === editingId);
    if (e) {
      e.emoji = document.getElementById('f-emoji').value;
      e.pays = pays; e.pays_code = code;
      e.couleur = COUNTRY_COLORS[code] || '#888';
      e.bg = COUNTRY_BG[code] || '#f5f5f5';
      e.ville = document.getElementById('f-ville').value;
      e.duree = parseInt(document.getElementById('f-duree').value) || 1;
      e.budget_jour = parseInt(document.getElementById('f-budget').value) || 0;
      e.description = document.getElementById('f-description').value;
      e.activites = document.getElementById('f-activites').value.split(',').map(s=>s.trim()).filter(Boolean);
      if (!e.saisons) e.saisons = {};
      e.saisons['nov-avril'] = { meteo: s1, conseil: e.saisons['nov-avril']?.conseil || '' };
      e.saisons['juil-aout'] = { meteo: s2, conseil: e.saisons['juil-aout']?.conseil || '' };
      e.saisons['sept-oct'] = { meteo: s3, conseil: e.saisons['sept-oct']?.conseil || '' };
    }
  } else {
    const newId = 'etape-' + Date.now();
    const maxOrdre = Math.max(...DATA.etapes.map(e=>e.ordre), 0);
    DATA.etapes.push({
      id: newId, pays, pays_code: code,
      couleur: COUNTRY_COLORS[code] || '#888',
      bg: COUNTRY_BG[code] || '#f5f5f5',
      ville: document.getElementById('f-ville').value,
      duree: parseInt(document.getElementById('f-duree').value) || 1,
      ordre: maxOrdre + 1,
      emoji: document.getElementById('f-emoji').value,
      description: document.getElementById('f-description').value,
      budget_jour: parseInt(document.getElementById('f-budget').value) || 0,
      activites: document.getElementById('f-activites').value.split(',').map(s=>s.trim()).filter(Boolean),
      saisons: {
        'nov-avril': { meteo: s1, conseil: '' },
        'juil-aout': { meteo: s2, conseil: '' },
        'sept-oct': { meteo: s3, conseil: '' }
      },
      images: [], notes: ''
    });
  }
  closeModal();
  saveLocal();
  render();
}

function deleteEtape(id, event) {
  event && event.stopPropagation();
  if (!confirm('Supprimer cette étape ?')) return;
  DATA.etapes = DATA.etapes.filter(e => e.id !== id);
  expandedCards.delete(id);
  saveLocal();
  render();
}

function moveEtape(id, dir, event) {
  event && event.stopPropagation();
  const sorted = [...DATA.etapes].sort((a,b)=>a.ordre-b.ordre);
  const idx = sorted.findIndex(e=>e.id===id);
  const swap = sorted[idx+dir];
  if (!swap) return;
  const etape = sorted[idx];
  const tmp = etape.ordre;
  etape.ordre = swap.ordre;
  swap.ordre = tmp;
  saveLocal();
  render();
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function closeModalOutside(e) { if (e.target === e.currentTarget) closeModal(); }

// ── BUDGET EDIT ──
function updateBudgetKey(key, val) {
  DATA.budget[key] = parseInt(val)||0;
  saveLocal();
  renderStats();
}
function updateEtapeBudget(id, val) {
  const e = DATA.etapes.find(x=>x.id===id);
  if (e) e.budget_jour = parseInt(val)||0;
  saveLocal();
  renderStats();
}

// ── SAVE / SYNC ──
function saveLocal() {
  try { localStorage.setItem('voyage-asie-data', JSON.stringify(DATA)); } catch(e){}
  showSyncStatus('Sauvegardé localement', false);
}

async function syncGithub() {
  showSyncStatus('Synchronisation...', true);
  try {
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(DATA, null, 2))));
    // Get current SHA
    const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/data/voyage.json`, {
      headers: { Authorization: `token ${getToken()}`, Accept:'application/vnd.github.v3+json' }
    });
    let sha = null;
    if (getRes.ok) { const j = await getRes.json(); sha = j.sha; }

    const body = { message: `Update voyage data ${new Date().toLocaleString('fr')}`, content };
    if (sha) body.sha = sha;

    const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/data/voyage.json`, {
      method:'PUT',
      headers:{ Authorization:`token ${getToken()}`, 'Content-Type':'application/json', Accept:'application/vnd.github.v3+json' },
      body: JSON.stringify(body)
    });
    if (putRes.ok) showSyncStatus('✓ Synchronisé sur GitHub', false);
    else showSyncStatus('⚠ Erreur GitHub', false);
  } catch(e) { showSyncStatus('⚠ Erreur réseau', false); }
}

function showSyncStatus(msg, saving) {
  const el = document.getElementById('sync-status');
  const dot = document.getElementById('sync-dot');
  document.getElementById('sync-text').textContent = msg;
  dot.className = 'sync-dot' + (saving ? ' saving' : '');
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

function exportData() {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'voyage-asie.json';
  a.click();
}

// ── KEYBOARD ──
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeLightbox(); }
});

// ── START ──
init();

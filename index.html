    </div>
    ${patches.length ? `<div class="trace-list">
      ${patches.map(p=>`<span class="patch-chip">${esc(p.nom)}
        ${p.source==='user'?`<button onclick="deletePatch('${p.id}')">×</button>`:''}</span>`).join('')}
    </div>` : ''}
  </div>`;
}

function initMap() {
  const host = document.getElementById('map');
  if (!host) return;
  host.innerHTML = '<canvas id="map-canvas"></canvas>' + mapControlsHtml();
  const cv = document.getElementById('map-canvas');

  MAP = new MapEngine.Map(cv, {
    center: [2.5, 115], zoom: 4, minZoom: 3, maxZoom: 17,
    theme: {
      sea: '#dbe7ee', land: '#f4efe5', coast: '#b9ab8f',
      landBase: '#f0eade', coastBase: '#cabfa9'
    },
    onClick: (lat, lng, e) => {
      if (traceMode) { traceAddPoint(lat, lng); return; }
      const hit = hitTestMarker(e);
      if (hit) { openPopupId = hit.id; renderPopup(hit); }
      else { openPopupId = null; hidePopup(); }
    },
    onMove: () => { syncPopupPosition(); updateZoomLabel(); }
  });

  MAP.setBase(decodeGeo(BASE_GEO));
  refreshMap(true);

  // le tracé et les pins se dessinent par-dessus
  const origDraw = MAP._draw.bind(MAP);
  MAP._draw = () => {
    origDraw();
    drawMarkers(MAP.ctx, MAP);
    drawTrace(MAP.ctx, MAP);
    syncPopupPosition();
  };
  MAP.draw();

  if (!window._mapResizeBound) {
    window.addEventListener('resize', () => MAP && MAP.resize());
    window._mapResizeBound = true;
  }
}

function mapControlsHtml() {
  return `
  <div class="map-ctrl">
    <button onclick="MAP.zoomBy(1)" title="Zoom +">+</button>
    <button onclick="MAP.zoomBy(-1)" title="Zoom −">−</button>
    <button onclick="fitAllPois()" title="Tout voir">⤢</button>
  </div>
  <div class="map-zoom" id="map-zoom-label"></div>
  <div class="map-attrib">Fond : Natural Earth (domaine public) · rendu maison</div>
  <div id="map-popup" class="map-popup"></div>`;
}

function updateZoomLabel() {
  const el = document.getElementById('map-zoom-label');
  if (el && MAP) el.textContent = 'z' + MAP.zoom.toFixed(1);
}

// ── décodage du fond delta-encodé ──
function decodeGeo(enc) {
  return enc.map(c => ({
    n: c.n,
    p: c.p.map(poly => poly.map(flat => {
      const ring = [[flat[0], flat[1]]];
      for (let i = 2; i < flat.length; i += 2)
        ring.push([ring[ring.length-1][0] + flat[i], ring[ring.length-1][1] + flat[i+1]]);
      return ring.map(([x, y]) => [x / 1e3, y / 1e3]);
    }))
  }));
}

function refreshMap(fit) {
  if (!MAP) return;
  MAP.setPatches(allPatches());
  const list = filteredPois();
  MAP.setMarkers(list.map(p => ({ id: p.id, lat: p.lat, lng: p.lng, poi: p })));
  if (fit && list.length) MAP.fitBounds(list.map(p => [p.lat, p.lng]), 50);
  updateResultCount();
  renderPoiList(list);
  updateZoomLabel();
}

// ── clustering simple, en pixels ──
function clusterMarkers(map) {
  const R = 34;
  const out = [];
  map.markers.forEach(m => {
    const [x, y] = map.latLngToPx(m.lat, m.lng);
    let put = null;
    for (const c of out) {
      if (Math.hypot(c.x - x, c.y - y) < R) { put = c; break; }
    }
    if (put) { put.items.push(m); put.x = (put.x * (put.items.length-1) + x) / put.items.length;
               put.y = (put.y * (put.items.length-1) + y) / put.items.length; }
    else out.push({ x, y, items: [m] });
  });
  return out;
}

let _clusters = [];
function drawMarkers(ctx, map) {
  _clusters = clusterMarkers(map);
  _clusters.forEach(c => {
    if (c.items.length > 1) {
      ctx.save();
      ctx.beginPath(); ctx.arc(c.x, c.y, 17, 0, Math.PI*2);
      ctx.fillStyle = '#1a1410'; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = '500 12px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(c.items.length, c.x, c.y);
      ctx.restore();
    } else {
      const p = c.items[0].poi;
      drawPin(ctx, c.x, c.y, poiColor(p), poiEmoji(p), openPopupId === p.id);
    }
  });
}

function drawPin(ctx, x, y, color, emoji, active) {
  ctx.save();
  const r = active ? 15 : 13;
  // goutte
  ctx.beginPath();
  ctx.arc(x, y - r, r, Math.PI * 0.15, Math.PI * 0.85, true);
  ctx.lineTo(x, y + 4);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 5; ctx.shadowOffsetY = 2;
  ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.font = (r - 3) + 'px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(emoji, x, y - r);
  ctx.restore();
}

function hitTestMarker(e) {
  if (!MAP) return null;
  const r = MAP.cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  for (const c of _clusters) {
    if (Math.hypot(c.x - mx, c.y - my) < 18) {
      if (c.items.length > 1) { MAP.flyTo(c.items[0].lat, c.items[0].lng, Math.min(MAP.zoom + 2.5, MAP.maxZoom)); return null; }
      return c.items[0].poi;
    }
  }
  return null;
}

// ── popup ──
function renderPopup(p) {
  const el = document.getElementById('map-popup');
  if (!el) return;
  const etape = DATA.etapes.find(e => e.id === p.etape);
  const tagHtml = (p.tags||[]).map(t => TAGS[t]
    ? `<span class="pop-tag">${TAGS[t].emoji} ${esc(TAGS[t].label)}</span>` : '').join('');
  el.innerHTML = `
    <div class="pop-head" style="border-color:${poiColor(p)}">
      <span class="pop-emoji">${poiEmoji(p)}</span>
      <div>
        <div class="pop-title">${esc(p.nom)}</div>
        <div class="pop-sub">${esc(TAXONOMY[p.theme]?.sub?.[p.sub]?.label||'')}${etape?' · '+esc(etape.ville):''}</div>
      </div>
      <button class="pop-x" onclick="hidePopup()">×</button>
    </div>
    ${p.note?`<div class="pop-note">${esc(p.note)}</div>`:''}
    ${tagHtml?`<div class="pop-tags">${tagHtml}</div>`:''}
    <div class="pop-coords">${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</div>
    <div class="pop-actions">
      <button onclick="openPoiModal('${p.id}')">Modifier</button>
      ${p.source==='user'?`<button class="del" onclick="deletePoi('${p.id}')">Supprimer</button>`:''}
    </div>`;
  el.classList.add('open');
  syncPopupPosition();
}
function hidePopup() {
  openPopupId = null;
  const el = document.getElementById('map-popup');
  if (el) el.classList.remove('open');
  MAP && MAP.draw();
}
function syncPopupPosition() {
  const el = document.getElementById('map-popup');
  if (!el || !openPopupId || !MAP) return;
  const p = allPois().find(x => x.id === openPopupId);
  if (!p) { hidePopup(); return; }
  const [x, y] = MAP.latLngToPx(p.lat, p.lng);
  el.style.left = x + 'px';
  el.style.top = (y - 34) + 'px';
}

function fitAllPois() {
  const list = filteredPois();
  if (list.length) MAP.fitBounds(list.map(p => [p.lat, p.lng]), 50);
}

function flyToPoi(id) {
  const p = allPois().find(x => x.id === id);
  if (!p || !MAP) return;
  MAP.flyTo(p.lat, p.lng, Math.max(MAP.zoom, 11));
  openPopupId = p.id;
  setTimeout(() => renderPopup(p), 620);
}

// ══════════════════════════════════════════════════════════════
//  OUTIL DE TRAÇAGE
//  Clique le long d'une côte -> récupère le tableau de coordonnées.
//  Précision réelle : c'est TOI qui regardes la vraie côte.
// ══════════════════════════════════════════════════════════════

let traceMode = false;
let tracePts = [];        // [[lng,lat], ...] — ordre GeoJSON
let traceUndoStack = [];
let tracePatchName = '';

function toggleTraceMode() {
  traceMode = !traceMode;
  if (!traceMode) { tracePts = []; traceUndoStack = []; }
  renderView();
}

function traceAddPoint(lat, lng) {
  tracePts.push([round6(lng), round6(lat)]);
  traceUndoStack = [];
  updateTracePanel();
  MAP && MAP.draw();
}

// Le nom survit aux re-render du panneau
function traceSetName(v) { tracePatchName = v; updateTracePanel(); }

function traceUndo() {
  if (!tracePts.length) return;
  traceUndoStack.push(tracePts.pop());
  updateTracePanel();
  MAP && MAP.draw();
}
function traceRedo() {
  if (!traceUndoStack.length) return;
  tracePts.push(traceUndoStack.pop());
  updateTracePanel();
  MAP && MAP.draw();
}
function traceClear() {
  if (tracePts.length && !confirm('Effacer le tracé en cours ?')) return;
  tracePts = []; traceUndoStack = [];
  updateTracePanel();
  MAP && MAP.draw();
}

function round6(v) { return Math.round(v * 1e6) / 1e6; } // ~0.1 m

// Distance du tracé (utile pour juger l'échelle)
function tracePerimeter() {
  let d = 0;
  for (let i = 1; i < tracePts.length; i++)
    d += MapEngine.haversine(tracePts[i-1][1], tracePts[i-1][0], tracePts[i][1], tracePts[i][0]);
  return d;
}

function traceBBox(pts) {
  let n = -90, s = 90, e = -180, w = 180;
  pts.forEach(([lng, lat]) => {
    n = Math.max(n, lat); s = Math.min(s, lat);
    e = Math.max(e, lng); w = Math.min(w, lng);
  });
  return { n: round6(n), s: round6(s), e: round6(e), w: round6(w) };
}

// Sortie : bloc JS prêt à coller dans PATCHES
function traceExport() {
  if (tracePts.length < 3) return '// il faut au moins 3 points';
  const name = (tracePatchName || document.getElementById('trace-name')?.value || 'sans-nom').trim();
  const minZ = document.getElementById('trace-minzoom')?.value || 8;
  const bb = traceBBox(tracePts);
  const coords = tracePts.map(([lng, lat]) => `[${lng},${lat}]`).join(',');
  return `{
  id: ${JSON.stringify(slugify(name))},
  nom: ${JSON.stringify(name)},
  minZoom: ${minZ},
  bbox: { n:${bb.n}, s:${bb.s}, e:${bb.e}, w:${bb.w} },
  rings: [[[${coords}]]]
},`;
}

function slugify(s) {
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'patch';
}

function traceCopy() {
  const txt = traceExport();
  const ta = document.getElementById('trace-out');
  if (ta) { ta.select(); }
  navigator.clipboard?.writeText(txt).then(
    () => showSyncStatus('✓ Copié — colle-le dans PATCHES', false),
    () => showSyncStatus('⚠ Copie impossible, sélectionne le texte', false)
  );
}

// Ajoute le tracé courant directement en mémoire (test immédiat)
function traceApplyNow() {
  if (tracePts.length < 3) { alert('Il faut au moins 3 points.'); return; }
  const name = (tracePatchName || document.getElementById('trace-name')?.value || 'Sans nom').trim();
  const minZ = +(document.getElementById('trace-minzoom')?.value || 8);
  const patch = {
    id: slugify(name) + '-' + Date.now(),
    nom: name, minZoom: minZ,
    bbox: traceBBox(tracePts),
    rings: [[tracePts.map(p => [...p])]],
    source: 'user'
  };
  if (!DATA.patches) DATA.patches = [];
  DATA.patches.push(patch);
  saveLocal();
  tracePts = []; traceUndoStack = [];
  renderView();
  showSyncStatus('✓ Zone ajoutée à la carte', false);
}

function deletePatch(id) {
  if (!confirm('Supprimer cette zone tracée ?')) return;
  DATA.patches = (DATA.patches || []).filter(p => p.id !== id);
  saveLocal();
  renderView();
}

function updateTracePanel() {
  const c = document.getElementById('trace-count');
  if (c) c.textContent = tracePts.length;
  const d = document.getElementById('trace-dist');
  if (d) d.textContent = tracePts.length > 1 ? tracePerimeter().toFixed(2) + ' km' : '—';
  const o = document.getElementById('trace-out');
  if (o) o.value = tracePts.length >= 3 ? traceExport() : '';
}

// Dessin du tracé en cours, par-dessus la carte
function drawTrace(ctx, map) {
  if (!traceMode || !tracePts.length) return;
  ctx.save();
  const px = tracePts.map(([lng, lat]) => map.latLngToPx(lat, lng));

  // polygone en cours
  ctx.beginPath();
  px.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  if (px.length > 2) {
    ctx.closePath();
    ctx.fillStyle = 'rgba(201,146,42,.18)';
    ctx.fill();
  }
  ctx.strokeStyle = '#c9922a';
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 4]);
  ctx.stroke();
  ctx.setLineDash([]);

  // points
  px.forEach(([x, y], i) => {
    ctx.beginPath();
    ctx.arc(x, y, i === 0 ? 5 : 3.5, 0, Math.PI * 2);
    ctx.fillStyle = i === 0 ? '#c0392b' : '#c9922a';
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  });
  ctx.restore();
}


// ── CARTE : état des filtres ──
let filterTheme = null;      // null = tous
let filterSub = null;        // null = tous
let filterTags = new Set();  // multi-select
let filterEtape = null;
let filterText = '';
let editingPoiId = null;

function allPois() {
  if (!DATA.pois) DATA.pois = getSeedPois();
  return DATA.pois;
}

function filteredPois() {
  const q = filterText.trim().toLowerCase();
  return allPois().filter(p => {
    if (filterTheme && p.theme !== filterTheme) return false;
    if (filterSub && p.sub !== filterSub) return false;
    if (filterEtape && p.etape !== filterEtape) return false;
    if (filterTags.size) {
      const pt = new Set(p.tags || []);
      for (const t of filterTags) if (!pt.has(t)) return false;
    }
    if (q) {
      const hay = ((p.nom||'') + ' ' + (p.note||'')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function poiColor(p) {
  return TAXONOMY[p.theme]?.color || '#888';
}
function poiEmoji(p) {
  return TAXONOMY[p.theme]?.sub?.[p.sub]?.emoji || TAXONOMY[p.theme]?.emoji || '📍';
}

// ── Filtres : reset & toggles ──
function setFilterTheme(t) {
  filterTheme = (filterTheme === t) ? null : t;
  filterSub = null; // le sous-thème dépend du thème
  renderView();
}
function setFilterSub(sub) {
  filterSub = (filterSub === sub) ? null : sub;
  renderView();
}
function toggleFilterTag(tag) {
  if (filterTags.has(tag)) filterTags.delete(tag); else filterTags.add(tag);
  renderView();
}
function setFilterEtape(v) { filterEtape = v || null; renderView(); }
function setFilterText(v) {
  filterText = v;
  refreshMap(false);
}
function resetFilters() {
  filterTheme = null; filterSub = null; filterTags.clear();
  filterEtape = null; filterText = '';
  renderView();
}

function updateResultCount() {
  const el = document.getElementById('poi-count');
  if (el) el.textContent = filteredPois().length;
}

// ── Construction de la vue carte ──
function buildCarte() {
  const pois = allPois();
  const themeChips = Object.entries(TAXONOMY).map(([k,t]) => {
    const n = pois.filter(p=>p.theme===k).length;
    if (!n && filterTheme!==k) return '';   // pas de thème vide dans la barre
    const on = filterTheme===k;
    return `<button class="chip ${on?'on':''}" style="--c:${t.color}"
      onclick="setFilterTheme('${k}')">${t.emoji} ${esc(t.label)} <b>${n}</b></button>`;
  }).join('');

  let subChips = '';
  if (filterTheme) {
    subChips = Object.entries(TAXONOMY[filterTheme].sub).map(([k,sub]) => {
      const n = pois.filter(p=>p.theme===filterTheme && p.sub===k).length;
      if (!n) return '';
      const on = filterSub===k;
      return `<button class="chip sm ${on?'on':''}" style="--c:${TAXONOMY[filterTheme].color}"
        onclick="setFilterSub('${k}')">${sub.emoji} ${esc(sub.label)} <b>${n}</b></button>`;
    }).join('');
  }

  // tags visibles = ceux présents dans le sous-ensemble courant
  const scope = pois.filter(p =>
    (!filterTheme || p.theme===filterTheme) && (!filterSub || p.sub===filterSub));
  const tagCounts = {};
  scope.forEach(p => (p.tags||[]).forEach(t => tagCounts[t]=(tagCounts[t]||0)+1));
  const tagChips = Object.entries(tagCounts).sort((a,b)=>b[1]-a[1]).map(([k,n]) => {
    const t = TAGS[k]; if (!t) return '';
    const on = filterTags.has(k);
    return `<button class="chip tag ${on?'on':''}" onclick="toggleFilterTag('${k}')">${t.emoji} ${esc(t.label)} <b>${n}</b></button>`;
  }).join('');

  const etapeOpts = [...DATA.etapes].sort((a,b)=>a.ordre-b.ordre)
    .map(e => `<option value="${esc(e.id)}" ${filterEtape===e.id?'selected':''}>${esc(e.ville)}</option>`).join('');

  const active = filterTheme||filterSub||filterTags.size||filterEtape||filterText;

  return `
  <div class="carte-wrap">
    <div class="carte-filters">
      <div class="filter-row">${themeChips}</div>
      ${subChips ? `<div class="filter-row indent">${subChips}</div>` : ''}
      ${tagChips ? `<div class="filter-row tags">${tagChips}</div>` : ''}
      <div class="filter-row bottom">
        <input class="filter-search" id="poi-search" placeholder="Rechercher…"
          value="${esc(filterText)}" oninput="setFilterText(this.value)">
        <select class="filter-select" onchange="setFilterEtape(this.value)">
          <option value="">Toutes les étapes</option>${etapeOpts}
        </select>
        <span class="filter-count"><b id="poi-count">${filteredPois().length}</b> lieux</span>
        ${active?`<button class="chip reset" onclick="resetFilters()">✕ Réinitialiser</button>`:''}
        <button class="chip add" onclick="openPoiModal()">+ Ajouter un lieu</button>
        <button class="chip trace ${traceMode?'on':''}" onclick="toggleTraceMode()">✏️ Tracer une zone</button>
      </div>
      ${traceMode ? tracePanelHtml() : ''}
    </div>
    <div id="map"></div>
    <div class="poi-list" id="poi-list"></div>
  </div>`;
}

function renderPoiList(list) {
  const el = document.getElementById('poi-list');
  if (!el) return;
  if (!list.length) {
    el.innerHTML = `<div class="poi-empty">Aucun lieu ne correspond à ces filtres.</div>`;
    return;
  }
  const byEtape = {};
  list.forEach(p => { (byEtape[p.etape||'_'] = byEtape[p.etape||'_'] || []).push(p); });
  const order = [...DATA.etapes].sort((a,b)=>a.ordre-b.ordre).map(e=>e.id);
  let html = '';
  order.forEach(eid => {
    const group = byEtape[eid]; if (!group) return;
    const et = DATA.etapes.find(e=>e.id===eid);
    html += `<div class="poi-group-label">${esc(et?et.ville:'')}</div>`;
    group.forEach(p => {
      html += `<div class="poi-row" onclick="flyToPoi('${p.id}')">
        <span class="poi-row-pin" style="background:${poiColor(p)}">${poiEmoji(p)}</span>
        <div class="poi-row-body">
          <div class="poi-row-title">${esc(p.nom)}</div>
          <div class="poi-row-sub">${esc(TAXONOMY[p.theme]?.sub?.[p.sub]?.label||'')}</div>
        </div>
        ${(p.tags||[]).slice(0,3).map(t=>TAGS[t]?`<span class="poi-row-tag">${TAGS[t].emoji}</span>`:'').join('')}
      </div>`;
    });
  });
  if (byEtape['_']) {
    html += `<div class="poi-group-label">Sans étape</div>`;
    byEtape['_'].forEach(p => {
      html += `<div class="poi-row" onclick="flyToPoi('${p.id}')">
        <span class="poi-row-pin" style="background:${poiColor(p)}">${poiEmoji(p)}</span>
        <div class="poi-row-body"><div class="poi-row-title">${esc(p.nom)}</div></div>
      </div>`;
    });
  }
  el.innerHTML = html;
}

// ── AJOUT / ÉDITION DE LIEU ──
function parseLatLng(input) {
  if (!input) return null;
  const str = input.trim();
  // "48.8584, 2.2945"
  let m = str.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);
  if (m) return { lat:+m[1], lng:+m[2] };
  // Google Maps: @lat,lng,zoom
  m = str.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) return { lat:+m[1], lng:+m[2] };
  // Google Maps: !3dLAT!4dLNG
  m = str.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
  if (m) return { lat:+m[1], lng:+m[2] };
  // ?q=lat,lng  ou  query=lat,lng
  m = str.match(/[?&](?:q|query|ll|center)=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) return { lat:+m[1], lng:+m[2] };
  return null;
}

function poiSubOptions(theme, selected) {
  if (!TAXONOMY[theme]) return '';
  return Object.entries(TAXONOMY[theme].sub)
    .map(([k,v]) => `<option value="${k}" ${selected===k?'selected':''}>${v.emoji} ${v.label}</option>`).join('');
}

function onPoiThemeChange() {
  const th = document.getElementById('pf-theme').value;
  document.getElementById('pf-sub').innerHTML = poiSubOptions(th, null);
}

function openPoiModal(id) {
  editingPoiId = id || null;
  const p = id ? allPois().find(x=>x.id===id) : null;
  const theme = p?.theme || 'voir';

  document.getElementById('poi-modal-title').textContent = p ? 'Modifier le lieu' : 'Nouveau lieu';
  document.getElementById('pf-nom').value = p?.nom || '';
  document.getElementById('pf-theme').innerHTML = Object.entries(TAXONOMY)
    .map(([k,t]) => `<option value="${k}" ${theme===k?'selected':''}>${t.emoji} ${t.label}</option>`).join('');
  document.getElementById('pf-sub').innerHTML = poiSubOptions(theme, p?.sub);
  document.getElementById('pf-coords').value = p ? `${p.lat}, ${p.lng}` : '';
  document.getElementById('pf-note').value = p?.note || '';
  document.getElementById('pf-etape').innerHTML = '<option value="">— Aucune —</option>' +
    [...DATA.etapes].sort((a,b)=>a.ordre-b.ordre)
      .map(e=>`<option value="${esc(e.id)}" ${p?.etape===e.id?'selected':''}>${esc(e.ville)}</option>`).join('');

  const sel = new Set(p?.tags || []);
  document.getElementById('pf-tags').innerHTML = Object.entries(TAGS)
    .map(([k,t]) => `<label class="tag-check ${sel.has(k)?'on':''}">
      <input type="checkbox" value="${k}" ${sel.has(k)?'checked':''}
        onchange="this.parentNode.classList.toggle('on', this.checked)">
      ${t.emoji} ${t.label}</label>`).join('');

  document.getElementById('pf-error').textContent = '';
  document.getElementById('poi-modal-overlay').classList.add('open');
}

function closePoiModal() { document.getElementById('poi-modal-overlay').classList.remove('open'); }
function closePoiModalOutside(e) { if (e.target === e.currentTarget) closePoiModal(); }

function savePoi() {
  const nom = document.getElementById('pf-nom').value.trim();
  const raw = document.getElementById('pf-coords').value;
  const err = document.getElementById('pf-error');

  if (!nom) { err.textContent = 'Il faut un nom.'; return; }
  const c = parseLatLng(raw);
  if (!c) {
    err.textContent = 'Coordonnées illisibles. Colle un lien Google Maps, ou "lat, lng" (ex : -8.75, 115.47).';
    return;
  }
  if (c.lat < -90 || c.lat > 90 || c.lng < -180 || c.lng > 180) {
    err.textContent = 'Coordonnées hors limites.'; return;
  }

  const tags = Array.from(document.querySelectorAll('#pf-tags input:checked')).map(i=>i.value);
  const fields = {
    nom,
    theme: document.getElementById('pf-theme').value,
    sub: document.getElementById('pf-sub').value,
    lat: c.lat, lng: c.lng,
    note: document.getElementById('pf-note').value.trim(),
    etape: document.getElementById('pf-etape').value || null,
    tags
  };

  if (editingPoiId) {
    const p = allPois().find(x=>x.id===editingPoiId);
    if (p) Object.assign(p, fields);
  } else {
    DATA.pois.push(Object.assign({ id:'poi-'+Date.now(), source:'user' }, fields));
  }
  closePoiModal();
  saveLocal();
  renderView();
}

function deletePoi(id) {
  if (!confirm('Supprimer ce lieu ?')) return;
  DATA.pois = allPois().filter(p => p.id !== id);
  saveLocal();
  renderView();
}

// \u2500\u2500 INTERACTIONS \u2500\u2500
function toggleCard(id, event) {
  if (event && event.target.closest('.card-action-btn, .card-notes, .image-upload-input, .card-image-thumb, .add-image-btn')) return;
  if (expandedCards.has(id)) expandedCards.delete(id);
  else expandedCards.add(id);
  renderView();
  renderSidebar();
}

function scrollToCard(id) {
  closeSidebarMobile();
  expandedCards.add(id);
  renderView();
  renderSidebar();
  setTimeout(() => {
    const el = document.getElementById('card-'+id);
    if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
  }, 80);
}

function bindImageUploads() {
  document.querySelectorAll('.image-upload-input').forEach(input => {
    input.addEventListener('change', async function() {
      const id = this.dataset.etape;
      const files = Array.from(this.files);
      for (const file of files) {
        const dataUrl = await readFileAsDataUrl(file);
        const etape = DATA.etapes.find(e => e.id === id);
        if (etape) {
          if (!etape.images) etape.images = [];
          etape.images.push(dataUrl);
        }
      }
      saveLocal();
      renderView();
    });
  });
}

function bindNotesSave() {
  document.querySelectorAll('.card-notes').forEach(ta => {
    ta.addEventListener('input', function() {
      const id = this.dataset.etape;
      const etape = DATA.etapes.find(e => e.id === id);
      if (etape) etape.notes = this.value;
      saveLocal();
    });
  });
}

function readFileAsDataUrl(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.readAsDataURL(file);
  });
}

function openLightbox(src, event) {
  event && event.stopPropagation();
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }

// \u2500\u2500 ADD / EDIT \u2500\u2500
function openAddModal() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Nouvelle \u00e9tape';
  document.getElementById('f-emoji').value = '🌍';
  document.getElementById('f-pays').value = 'Philippines';
  document.getElementById('f-ville').value = '';
  document.getElementById('f-duree').value = '3';
  document.getElementById('f-budget').value = '35';
  document.getElementById('f-description').value = '';
  document.getElementById('f-activites').value = '';
  document.getElementById('f-s1').value = '';
  document.getElementById('f-s2').value = '';
  document.getElementById('f-s3').value = '';
  document.getElementById('modal-overlay').classList.add('open');
}

function editEtape(id, event) {
  event && event.stopPropagation();
  const e = DATA.etapes.find(x => x.id === id);
  if (!e) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'Modifier l\'\u00e9tape';
  document.getElementById('f-emoji').value = e.emoji || '🌍';
  document.getElementById('f-pays').value = e.pays || 'Philippines';
  document.getElementById('f-ville').value = e.ville || '';
  document.getElementById('f-duree').value = e.duree || 3;
  document.getElementById('f-budget').value = e.budget_jour || 35;
  document.getElementById('f-description').value = e.description || '';
  document.getElementById('f-activites').value = (e.activites||[]).join(', ');
  document.getElementById('f-s1').value = e.saisons?.['nov-avril']?.meteo || '';
  document.getElementById('f-s2').value = e.saisons?.['juil-aout']?.meteo || '';
  document.getElementById('f-s3').value = e.saisons?.['sept-oct']?.meteo || '';
  document.getElementById('modal-overlay').classList.add('open');
}

function saveEtape() {
  const pays = document.getElementById('f-pays').value;
  const code = COUNTRY_CODES[pays] || '??';
  const s1 = document.getElementById('f-s1').value;
  const s2 = document.getElementById('f-s2').value;
  const s3 = document.getElementById('f-s3').value;

  if (editingId) {
    const e = DATA.etapes.find(x => x.id === editingId);
    if (e) {
      e.emoji = document.getElementById('f-emoji').value;
      e.pays = pays; e.pays_code = code;
      e.couleur = COUNTRY_COLORS[code] || '#888';
      e.bg = COUNTRY_BG[code] || '#f5f5f5';
      e.ville = document.getElementById('f-ville').value;
      e.duree = parseInt(document.getElementById('f-duree').value) || 1;
      e.budget_jour = parseInt(document.getElementById('f-budget').value) || 0;
      e.description = document.getElementById('f-description').value;
      e.activites = document.getElementById('f-activites').value.split(',').map(s=>s.trim()).filter(Boolean);
      if (!e.saisons) e.saisons = {};
      e.saisons['nov-avril'] = { meteo: s1, conseil: e.saisons['nov-avril']?.conseil || '' };
      e.saisons['juil-aout'] = { meteo: s2, conseil: e.saisons['juil-aout']?.conseil || '' };
      e.saisons['sept-oct'] = { meteo: s3, conseil: e.saisons['sept-oct']?.conseil || '' };
    }
  } else {
    const newId = 'etape-' + Date.now();
    const maxOrdre = Math.max(...DATA.etapes.map(e=>e.ordre), 0);
    DATA.etapes.push({
      id: newId, pays, pays_code: code,
      couleur: COUNTRY_COLORS[code] || '#888',
      bg: COUNTRY_BG[code] || '#f5f5f5',
      ville: document.getElementById('f-ville').value,
      duree: parseInt(document.getElementById('f-duree').value) || 1,
      ordre: maxOrdre + 1,
      emoji: document.getElementById('f-emoji').value,
      description: document.getElementById('f-description').value,
      budget_jour: parseInt(document.getElementById('f-budget').value) || 0,
      activites: document.getElementById('f-activites').value.split(',').map(s=>s.trim()).filter(Boolean),
      saisons: {
        'nov-avril': { meteo: s1, conseil: '' },
        'juil-aout': { meteo: s2, conseil: '' },
        'sept-oct': { meteo: s3, conseil: '' }
      },
      images: [], notes: ''
    });
  }
  closeModal();
  saveLocal();
  render();
}

function deleteEtape(id, event) {
  event && event.stopPropagation();
  if (!confirm('Supprimer cette \u00e9tape ?')) return;
  DATA.etapes = DATA.etapes.filter(e => e.id !== id);
  expandedCards.delete(id);
  saveLocal();
  render();
}

function moveEtape(id, dir, event) {
  event && event.stopPropagation();
  const sorted = [...DATA.etapes].sort((a,b)=>a.ordre-b.ordre);
  const idx = sorted.findIndex(e=>e.id===id);
  const swap = sorted[idx+dir];
  if (!swap) return;
  const etape = sorted[idx];
  const tmp = etape.ordre;
  etape.ordre = swap.ordre;
  swap.ordre = tmp;
  saveLocal();
  render();
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function closeModalOutside(e) { if (e.target === e.currentTarget) closeModal(); }

// \u2500\u2500 BUDGET EDIT \u2500\u2500
function updateBudgetKey(key, val) {
  DATA.budget[key] = parseInt(val)||0;
  saveLocal();
  renderStats();
}
function updateEtapeBudget(id, val) {
  const e = DATA.etapes.find(x=>x.id===id);
  if (e) e.budget_jour = parseInt(val)||0;
  saveLocal();
  renderStats();
}

// \u2500\u2500 SAVE / SYNC \u2500\u2500
function saveLocal() {
  try { localStorage.setItem('voyage-asie-data', JSON.stringify(DATA)); } catch(e){}
  showSyncStatus('Sauvegard\u00e9 localement', false);
}

async function syncGithub() {
  if (!getToken()) {
    setupToken();
    if (!getToken()) { showSyncStatus('\u26a0 Token requis pour synchroniser', false); return; }
  }
  showSyncStatus('Synchronisation...', true);
  try {
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(DATA, null, 2))));
    // Get current SHA
    const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/data/voyage.json`, {
      headers: { Authorization: `token ${getToken()}`, Accept:'application/vnd.github.v3+json' }
    });
    let sha = null;
    if (getRes.ok) { const j = await getRes.json(); sha = j.sha; }

    const body = { message: `Update voyage data ${new Date().toLocaleString('fr')}`, content };
    if (sha) body.sha = sha;

    const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/data/voyage.json`, {
      method:'PUT',
      headers:{ Authorization:`token ${getToken()}`, 'Content-Type':'application/json', Accept:'application/vnd.github.v3+json' },
      body: JSON.stringify(body)
    });
    if (putRes.ok) showSyncStatus('\u2713 Synchronis\u00e9 sur GitHub', false);
    else showSyncStatus('\u26a0 Erreur GitHub', false);
  } catch(e) { showSyncStatus('\u26a0 Erreur r\u00e9seau', false); }
}

function showSyncStatus(msg, saving) {
  const el = document.getElementById('sync-status');
  const dot = document.getElementById('sync-dot');
  document.getElementById('sync-text').textContent = msg;
  dot.className = 'sync-dot' + (saving ? ' saving' : '');
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

function exportData() {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'voyage-asie.json';
  a.click();
}

// ── PHOTO OBJET : import fichier + saisie URL ──
(function bindEquipPhotoInputs() {
  const fileInput = document.getElementById('ef-photo-file');
  const urlInput = document.getElementById('ef-photo');
  if (fileInput) {
    fileInput.addEventListener('change', async function() {
      const file = this.files && this.files[0];
      if (!file) return;
      const dataUrl = await readFileAsDataUrl(file);
      equipDraftPhoto = dataUrl;
      // une photo importée l'emporte : on vide le champ URL pour éviter toute ambiguïté
      if (urlInput) urlInput.value = '';
      renderPhotoPreview();
    });
  }
  if (urlInput) {
    urlInput.addEventListener('input', function() {
      const v = this.value.trim();
      if (v) { equipDraftPhoto = v; }
      else if (!/^data:image\//i.test(equipDraftPhoto)) { equipDraftPhoto = ''; }
      renderPhotoPreview();
    });
  }
})();

// \u2500\u2500 KEYBOARD \u2500\u2500
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeLightbox(); closePoiModal(); closeEquipModal(); closeSidebarMobile(); }
});
